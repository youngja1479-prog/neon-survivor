  midBossSpawned=true;
  const dx=speedBase.x-player.x,dy=speedBase.y-player.y,l=Math.hypot(dx,dy)||1;
  const x=player.x+dx/l*720, y=player.y+dy/l*720;

}
function spawnHardBossAtGate(){

  const ang=Math.atan2((player?player.y:0)-speedBase.y,(player?player.x:0)-speedBase.x);
  spawnNS1Boss(true, speedBase.x+Math.cos(ang)*220, speedBase.y+Math.sin(ang)*220);
}

function updateNS1Boss(e,dt){
  if(e.hp<=0) return;
  e.hit=Math.max(0,(e.hit||0)-dt);
  const tgt=nearestAlly(e.x,e.y);
  const ddx=tgt.x-e.x,ddy=tgt.y-e.y,dd=Math.hypot(ddx,ddy)||1;
  e.dx=ddx/dd;e.dy=ddy/dd;
  const hard=!!e.hard;
  const shootCd=hard?1.35:1.8;
  const dashWind=hard?0.55:0.72;
  const dashSpd=hard?520:430;
  if(e.atk==='idle'){
    e.x+=e.dx*e.spd*dt;e.y+=e.dy*e.spd*dt;
    e.shotCd=(e.shotCd||0)-dt;e.dashCd=(e.dashCd||0)-dt;
    if(e.dashCd<=0&&dd<420){e.atk='wind';e.atkT=dashWind;e.warnT=dashWind;e.dashCd=hard?3.4:4.6;}
    else if(e.shotCd<=0){bossNS1Shoot(e);e.shotCd=shootCd;}
  }else if(e.atk==='wind'){
    e.atkT-=dt;e.warnT=e.atkT;
    if(e.atkT<=0){e.atk='dash';e.atkT=0.28;}
  }else if(e.atk==='dash'){
    e.x+=e.dx*dashSpd*dt;e.y+=e.dy*dashSpd*dt;e.atkT-=dt;
    if(e.atkT<=0){e.atk='idle';}
  }
  for(const u of partyUnits()){
    if(!u||u.hp<=0) continue;
    const pr=e.r+u.r-2,pdx=e.x-u.x,pdy=e.y-u.y;
    if(pdx*pdx+pdy*pdy<pr*pr) hurtPlayer(e.dmg,e.x,e.y,u);
  }
}

function splitTalkParts(text){
  const parts=[];let rest=text||'';
  const re=/(\([^)]+\))/g;let m,last=0;
  while((m=re.exec(rest))){
    if(m.index>last) parts.push({thought:false,s:rest.slice(last,m.index)});
    parts.push({thought:true,s:m[1]});
    last=m.index+m[1].length;
  }
  if(last<rest.length) parts.push({thought:false,s:rest.slice(last)});
  return parts.filter(p=>p.s);
}

}

  ctx.fillStyle='rgba(12,10,32,0.92)';rounded(bx,by,boxW,boxH,16);ctx.fill();
  ctx.strokeStyle=st.border;ctx.lineWidth=2;
  ctx.shadowColor=st.shadow;ctx.shadowBlur=16;
  rounded(bx,by,boxW,boxH,16);ctx.stroke();ctx.shadowBlur=0;
  if(st.kind==='hero') drawPortraitAt(bx+36,by+boxH*0.58,pr);
  else if(st.kind==='speed') drawSpeedPortraitAt(bx+36,by+boxH*0.58,pr);
  else drawBossPortraitAt(bx+36,by+boxH*0.58,pr,who==='???');
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.fillStyle=st.col;
  ctx.font='900 '+Math.max(13,14*u)+'px '+FONT;
  ctx.fillText(who,bx+72,by+24);
  let ty=by+50;
  for(const ln of textLines){
    const parts=splitTalkParts(ln);
    let tx=bx+72;
    for(const part of parts){
      if(part.thought){
        ctx.fillStyle='rgba(186,190,220,0.72)';
        ctx.font='italic 700 '+Math.max(14,15*u)+'px '+FONT;
      }else{
        ctx.fillStyle='#fff';
        ctx.font='700 '+Math.max(15,16*u)+'px '+FONT;
      }
      ctx.fillText(part.s,tx,ty);
      tx+=ctx.measureText(part.s).width;
    }
    ty+=lh;
  }
  ctx.fillStyle='#8a8fc0';ctx.font='700 12px '+FONT;ctx.textAlign='right';
  ctx.fillText(isStoryHost()?'탭 / 클릭하여 계속':'호스트가 넘기는 중',bx+boxW-16,by+boxH-12);
}

function tickCh2(dt){
  if(chapterN<2||state!=='play') return;
  if(!midBossSpawned&&speedBase&&player){
    const start=Math.hypot((speedBase.fromX!=null?speedBase.fromX:0)-speedBase.x,(speedBase.fromY!=null?speedBase.fromY:0)-speedBase.y)||SPEED_DIST;
    const left=Math.hypot(speedBase.x-player.x,speedBase.y-player.y);
    if(left<start*0.58) spawnMidBoss();
  }
}

function tickV17(dt){
  btnFlash=Math.max(0,btnFlash-dt);
  changeFlash=Math.max(0,changeFlash-dt);
  if(player) player.changeCd=Math.max(0,(player.changeCd||0)-dt);
  const units=(allies&&allies.length)?allies:[];
  for(const u of units){
    if(!u) continue;
    u.changeCd=Math.max(0,(u.changeCd||0)-dt);
    if(u.sdash) tickSdash(u,dt);
  }
  if(player&&player.sdash&&!units.includes(player)) tickSdash(player,dt);
  if(player&&player.skin==='speed'&&!player.sdash&&state==='play'){
    const moving=Math.abs(player.vx||0)+Math.abs(player.vy||0)>0.01||keys.KeyW||keys.KeyA||keys.KeyS||keys.KeyD||keys.ArrowUp||(typeof joy==='object'&&joy&&(joy.x||joy.y));
    if(moving&&afterimages.length<90) afterimages.push({x:player.x,y:player.y,ang:player.facing||0,life:0.2,skin:'speed'});
  }
  if(speedJoined) tickBuddies(dt);
  tickPickups(dt);
  tickCh2(dt);
}
function tickV17Client(dt){
  btnFlash=Math.max(0,btnFlash-dt);
  changeFlash=Math.max(0,changeFlash-dt);
  if(player) player.changeCd=Math.max(0,(player.changeCd||0)-dt);
  if(speedJoined) tickBuddies(dt);
}

function applyCutIndex(i){
  if(state!=='cutscene'){
    if(cutKind==='post'||bossDefeated){state='cutscene';}
    else if(!arriveShown) onArriveNeonBase(true);
    else state='cutscene';
  }
  cutI=Math.max(0,i|0);
  startCutBeat();
}

/* ===== v20: chapter progress save + continue ===== */
const NS2_SAVE_KEY='ns2-ch-progress';

function packSave(P){
  P=P||player;
  if(!P) return null;
  return {
    v:20,
    chapter:2,
    level:P.level||1,
    xp:P.xp||0,
    next:P.next||8,
    wep:Object.assign({},P.wep||{bolt:1}),
    pas:Object.assign({},P.pas||{regen:1}),
    dash:{
      dashMaxCd:P.dashMaxCd||1.55,
      dashMax:P.dashMax||1,
      dashDur:P.dashDur||0.16,
      dashVamp:P.dashVamp||0,
      dashDmg:P.dashDmg||24
    },
    skills:{A:P.skA||'shock',B:P.skB||'shield'},
    maxHp:P.maxHp||100,
    spd:P.spd||215,
    pickup:P.pickup||95
  };
}

function saveChapterProgress(P){
  const snap=packSave(P||player);
  if(!snap) return null;
  try{localStorage.setItem(NS2_SAVE_KEY,JSON.stringify(snap));}catch(e){}
  return snap;
}

function loadChapterSave(){
  try{
    const raw=localStorage.getItem(NS2_SAVE_KEY);
    if(!raw) return null;
    const s=JSON.parse(raw);
    if(!s||s.chapter<2) return null;
    return s;
  }catch(e){return null;}
}
function hasChapterSave(){return !!loadChapterSave();}
function clearChapterSave(){try{localStorage.removeItem(NS2_SAVE_KEY);}catch(e){}}

function applySnapshot(P,snap){
  if(!P||!snap) return P;
  P.level=Math.max(1,snap.level|0);
  P.xp=Math.max(0,+snap.xp||0);
  P.next=Math.max(1,snap.next||Math.floor(8*Math.pow(1.34,P.level-1)));
  P.wep=Object.assign({bolt:1},snap.wep||{});
  P.pas=Object.assign({regen:1},snap.pas||{});
  if(!P.pas.regen) P.pas.regen=1;
  const d=snap.dash||{};
  P.dashMaxCd=d.dashMaxCd||1.55;
  P.dashMax=d.dashMax||1;
  P.dashCharges=P.dashMax;
  P.dashDur=d.dashDur||0.16;
  P.dashVamp=d.dashVamp||0;
  P.dashDmg=d.dashDmg||24;
  P.dashCd=0;P.dashT=0;
  P.skA=(snap.skills&&snap.skills.A)||'shock';
  P.skB=(snap.skills&&snap.skills.B)||'shield';
  const heart=P.pas.heart||0, speed=P.pas.speed||0, mag=P.pas.magnet||0;
  P.maxHp=snap.maxHp||(100+20*heart);
  P.hp=P.maxHp;
  P.spd=215*(1+0.08*speed);
  P.pickup=95*(1+0.3*mag);
  if(P.wepCd){for(const k of Object.keys(P.wep)) if(P.wepCd[k]==null) P.wepCd[k]=0;}
  return P;
}

function fairLoadout(level){
  level=Math.max(1,level|0);
  const snap={
    v:20,chapter:2,level,xp:0,next:Math.floor(8*Math.pow(1.34,level-1)),
    wep:{bolt:1},pas:{regen:1},
    dash:{dashMaxCd:1.55,dashMax:1,dashDur:0.16,dashVamp:0,dashDmg:24},
    skills:{A:'shock',B:'shield'},
    maxHp:100,spd:215,pickup:95
  };
  const steps=[
    ['wnew','pulse'],['pas','power'],['pas','haste'],['wup','bolt'],['pas','armor'],
    ['wnew','chain'],['pas','speed'],['wup','pulse'],['pas','power'],['dash','charge'],
    ['pas','haste'],['wup','bolt'],['pas','regen'],['wnew','boom'],['dash','dashlen'],
    ['pas','heart'],['wup','chain'],['pas','area'],['wup','pulse'],['dash','dashcd'],
    ['pas','power'],['wnew','orbit'],['pas','haste'],['wup','boom'],['pas','armor'],
    ['wup','bolt'],['dash','dashvamp'],['pas','speed'],['wup','chain'],['pas','regen'],
    ['wnew','seek'],['pas','heart'],['wup','orbit'],['dash','dashcd'],['pas','power'],
    ['wup','boom'],['pas','haste'],['wup','pulse'],['dash','dashlen'],['pas','armor']
  ];
  const wepCount=()=>Object.keys(snap.wep).filter(id=>WEAPONS[id]&&!WEAPONS[id].sub).length;
  for(let i=0;i<level-1&&i<steps.length;i++){
    const [k,id]=steps[i];
    if(k==='wnew'){
      if(snap.wep[id]) {if((snap.wep[id]||0)<MAXLV) snap.wep[id]++; }
      else if(WEAPONS[id]&&(WEAPONS[id].sub||wepCount()<MAX_WEAPONS)) snap.wep[id]=1;
    }else if(k==='wup'){
      if(snap.wep[id]&&snap.wep[id]<MAXLV) snap.wep[id]++;
    }else if(k==='pas'){
      const lv=(snap.pas[id]||0);
      if(lv<MAXLV) snap.pas[id]=lv+1;
    }else if(k==='dash'){
      if(id==='charge'&&snap.dash.dashMax<3) snap.dash.dashMax++;
      else if(id==='dashlen') snap.dash.dashDur=Math.min(0.24,(snap.dash.dashDur||0.16)+0.04);
      else if(id==='dashvamp') snap.dash.dashVamp=Math.min(3,(snap.dash.dashVamp||0)+1);
      else if(id==='dashcd') snap.dash.dashMaxCd=Math.max(0.5,snap.dash.dashMaxCd*0.75);
      else if(id==='dashdmg') snap.dash.dashDmg*=1.7;
    }
  }
  snap.maxHp=100+20*(snap.pas.heart||0);
  snap.spd=215*(1+0.08*(snap.pas.speed||0));
  snap.pickup=95*(1+0.3*(snap.pas.magnet||0));
  return snap;
}

function startContinueChapter2(fromNet,hostSnap){
  hideJoinInput();
  startGame(true);
  ch2Continue=true;
  const mine=loadChapterSave();
  const snap=mine||(hostSnap?fairLoadout(hostSnap.level||1):null);
  if(snap&&player) applySnapshot(player,snap);
  if(player){
    player.hp=player.maxHp;
    player.skin='hero';
    if(neonBase){player.x=neonBase.x;player.y=neonBase.y+80;cam.x=player.x;cam.y=player.y;}
  }
  if(typeof isNetHost==='function'&&isNetHost()){
    const hostLv=(player&&player.level)||1;
    for(const a of (allies||[])){
      if(!a||a===player) continue;
      applySnapshot(a,fairLoadout(hostLv));
      a.hp=a.maxHp;
      if(neonBase){a.x=neonBase.x+rand(-40,40);a.y=neonBase.y+80+rand(-20,20);}
    }
    if(!fromNet) bcast({t:'cont2',hostSnap:packSave(player)});
  }else if(!fromNet&&typeof isNetClient==='function'&&isNetClient()){
    netSend({t:'loadout',snap:packSave(player)});
  }else if(fromNet&&typeof isNetClient==='function'&&isNetClient()){
    netSend({t:'loadout',snap:packSave(player)});
  }
  enterChapter2Card();
}

window.__ns2v20={
  NS2_SAVE_KEY,packSave,saveChapterProgress,loadChapterSave,hasChapterSave,clearChapterSave,
  applySnapshot,fairLoadout,startContinueChapter2
};
