<input id="joinCode" maxlength="4" autocomplete="off" spellcheck="false" autocapitalize="characters" inputmode="text" aria-label="방 코드"
  style="display:none;position:fixed;z-index:8;box-sizing:border-box;text-align:center;text-transform:uppercase;letter-spacing:0.35em;font:900 22px 'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;color:#fff;background:#14122e;border:2px solid #4a3aa0;border-radius:12px;padding:8px 10px;caret-color:#4df3ff;outline:none;">

<script>
"use strict";
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d",{alpha:false});
let W=0,H=0,DPR=1,scale=1,dprCap=2,perfN=0,perfSum=0,vgCan=null,vgW=0,vgH=0;
function perfTick(raw){
  if(raw>250) return;
  perfN++;perfSum+=raw;
  if(perfN>=120){
    const avg=perfSum/perfN;perfN=0;perfSum=0;
    if(avg>24&&dprCap>1){dprCap=Math.max(1,Math.round((dprCap-0.5)*100)/100);resize();}
  }
}
function viewportSize(){
  const vv=window.visualViewport;
  if(vv&&vv.width&&vv.height) return {w:Math.round(vv.width),h:Math.round(vv.height),x:vv.offsetLeft||0,y:vv.offsetTop||0};
  return {w:window.innerWidth,h:window.innerHeight,x:0,y:0};
}
function resize(){
  DPR=Math.min(dprCap,window.devicePixelRatio||1,2);
  vgCan=null;
  const v=viewportSize();
  W=Math.max(1,v.w);H=Math.max(1,v.h);
  canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);
  canvas.style.width=W+"px";canvas.style.height=H+"px";
  canvas.style.position="fixed";
  canvas.style.left=v.x+"px";
  canvas.style.top=v.y+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  scale=Math.max(0.62,Math.min(1.1,Math.min(W,H)/720)); // v9 1편과 같은 화면 확대 비율
  layoutUI();
  if(typeof joy!=="undefined"&&joy.active) endJoy();
  try{if(joinInputOn) showJoinInput();}catch(_){}
}
window.addEventListener("resize",resize);
window.addEventListener("orientationchange",()=>setTimeout(resize,80));
if(window.visualViewport){
  visualViewport.addEventListener("resize",resize);
  visualViewport.addEventListener("scroll",resize);
}

const FONT="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif";
const TAU=Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const randi=(a,b)=>Math.floor(rand(a,b+1));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function norm(x,y){const l=Math.hypot(x,y);return l<1e-6?{x:0,y:0}:{x:x/l,y:y/l};}
function getInsets(){
  const cs=getComputedStyle(document.documentElement);
  const n=v=>Math.max(0,parseFloat(cs.getPropertyValue(v))||0);
  return {t:n("--sat"),r:n("--sar"),b:n("--sab"),l:n("--sal")};
}

let actx=null;
function ensureAudio(){
  if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
  if(actx.state==="suspended") actx.resume();
}
let beepN=0,beepWin=0;
function beep(freq,dur,type,vol,slide){
  if(!actx) return;
  const now=performance.now();
  if(now-beepWin>1000){beepWin=now;beepN=0;}
  if(++beepN>12) return;
  try{
    const t=actx.currentTime;
    const o=actx.createOscillator();
    const g=actx.createGain();
    o.type=type||"square";
    o.frequency.setValueAtTime(freq,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+dur);
    g.gain.setValueAtTime(vol||0.05,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g);g.connect(actx.destination);
    o.start(t);o.stop(t+dur+0.02);
  }catch(err){}
}
function vibe(pat){
  try{ if(navigator.vibrate) navigator.vibrate(pat); }catch(err){}
}
let fsTried=false;
function tryFullscreen(){
  if(fsTried) return;
  fsTried=true;
  const el=document.documentElement;
  const req=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen;
  if(!req) return;
  Promise.resolve(req.call(el)).catch(()=>{});
}

const keys=Object.create(null);
const mouse={x:0,y:0};
let usedTouch=false,lastTouchAt=-1e9,dashHeld=false,dashTouchId=null;
let joy={active:false,id:null,cx:0,cy:0,x:0,y:0,dx:0,dy:0,r:64};
let uiPause={x:0,y:0,r:22},uiDash={x:0,y:0,r:48},uiResume={x:0,y:0,w:0,h:0};
let uiSkills=[];
const SKILLS=[
  {id:"shock",name:"충격파",short:"충격",key:"Q",code:"KeyQ",col:"#ff5ea8",cd:6.5},
  {id:"shield",name:"보호막",short:"보호",key:"E",code:"KeyE",col:"#5ee7ff",cd:8},
  {id:"change",name:"체인지",short:"체인지",key:"R",code:"KeyR",col:"#39ff88",cd:1}
];
let skillHeld=Object.create(null);


function isTouchUI(){
  return usedTouch||("ontouchstart" in window&&matchMedia("(pointer:coarse)").matches);
}
function layoutUI(){
  const ins=getInsets();
  const short=Math.min(W,H);
  const u=clamp(short/390,0.8,1.4);
  const pad=Math.max(10,10*u);
  const pauseR=Math.max(20,22*u);
  uiPause={x:W-ins.r-pad-pauseR,y:ins.t+14+pad+pauseR,r:pauseR}; // v12: 1편처럼 XP바 아래
  const dashR=Math.max(42,Math.min(58,short*0.12));
  uiDash={x:W-ins.r-pad-dashR-2,y:H-ins.b-pad-dashR-6,r:dashR};
  const skillR=Math.max(22,Math.min(32,dashR*0.58));
  const dist=dashR+skillR+14;
  const angs=[-Math.PI*0.50,-Math.PI*0.74,-Math.PI*0.97];
  uiSkills=SKILLS.map((s,i)=>{
    const a=angs[i];
    let x=uiDash.x+Math.cos(a)*dist;
    let y=uiDash.y+Math.sin(a)*dist;
    x=clamp(Math.min(x,uiDash.x),ins.l+skillR+6,W-ins.r-skillR-6);
    y=clamp(Math.min(y,uiDash.y),ins.t+skillR+6,H-ins.b-skillR-6);
    return {id:s.id,x,y,r:skillR,col:s.col,short:s.short,key:s.key,name:s.name,cd:s.cd};
  });
  const rw=Math.min(280,W*0.72),rh=Math.max(52,56*u);
  uiResume={x:W/2-rw/2,y:H*0.54,w:rw,h:rh};
}
function hitCirc(x,y,c,extra){return Math.hypot(x-c.x,y-c.y)<=c.r+(extra||0);}
function hitRect(x,y,r){return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;}

resize();

window.addEventListener("keydown",e=>{
  keys[e.code]=true;
  if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code)) e.preventDefault();
  onKey(e.code);
});
window.addEventListener("keyup",e=>{
  keys[e.code]=false;
  if(e.code==="Space"||e.code.startsWith("Shift")) dashHeld=false;
  if(e.code==="KeyQ") skillHeld.shock=false;
  if(e.code==="KeyE") skillHeld.shield=false;
  if(e.code==="KeyR") skillHeld.change=false;
});
window.addEventListener("mousemove",e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
window.addEventListener("mousedown",e=>{
  if(performance.now()-lastTouchAt<700) return;
  ensureAudio();
  onPointer(e.clientX,e.clientY,false);
});
window.addEventListener("mouseup",()=>{dashHeld=false;});
window.addEventListener("contextmenu",e=>e.preventDefault());
function bindTouch(el){
  el.addEventListener("touchstart",onTouchStart,{passive:false});
  el.addEventListener("touchmove",onTouchMove,{passive:false});
  el.addEventListener("touchend",onTouchEnd,{passive:false});
  el.addEventListener("touchcancel",onTouchEnd,{passive:false});
}
bindTouch(window);
window.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
window.addEventListener("gesturechange",e=>e.preventDefault(),{passive:false});
window.addEventListener("gestureend",e=>e.preventDefault(),{passive:false});
window.addEventListener("wheel",e=>{if(e.ctrlKey)e.preventDefault();},{passive:false});
function releaseInput(){
  if(typeof endJoy==="function") endJoy();
  dashHeld=false;dashTouchId=null;
  skillHeld=Object.create(null);
  for(const k in keys) keys[k]=false;
}
function onAppHide(){
  releaseInput();
  if(state==="play") togglePause();
}
window.addEventListener("blur",onAppHide);
document.addEventListener("visibilitychange",()=>{if(document.hidden) onAppHide();});

function onTouchStart(e){
  e.preventDefault();
  lastTouchAt=performance.now();
  usedTouch=true;
  ensureAudio();
  tryFullscreen();
  for(let i=0;i<e.changedTouches.length;i++){
    const t=e.changedTouches[i];
    onPointer(t.clientX,t.clientY,true,t.identifier);
  }
}
function onTouchMove(e){
  e.preventDefault();
  for(let i=0;i<e.changedTouches.length;i++){
    const t=e.changedTouches[i];
    if(joy.active&&t.identifier===joy.id) moveJoy(t.clientX,t.clientY);
  }
}
function onTouchEnd(e){
  e.preventDefault();
  lastTouchAt=performance.now();
  for(let i=0;i<e.changedTouches.length;i++){
    const t=e.changedTouches[i];
    if(joy.active&&t.identifier===joy.id) endJoy();
    if(dashTouchId===t.identifier){dashTouchId=null;dashHeld=false;}
  }
  if(!e.touches||e.touches.length===0){
    endJoy();dashTouchId=null;dashHeld=false;skillHeld=Object.create(null);
  }
}

function onKey(code){
  ensureAudio();
  if(state==="title"&&(code==="Enter"||code==="Space")) openParty();
  else if(state==="party"&&(code==="Enter"||code==="Space")){
    if(partyView==="home") startSolo();
    else if(partyView==="join"){const el=document.getElementById("joinCode");joinRoom(el?el.value:"");}
    else if(partyView==="room"&&isNetHost()) hostStartParty();
  }else if(state==="party"&&code==="Escape"){if(partyView==="home") backToTitle();else {hideJoinInput();cleanupNet();partyView="home";partyMsg="";}}
  else if((state==="notice"||state==="story"||state==="chapter")&&(code==="Enter"||code==="Space")) storyAdvance();
  else if(state==="story"&&(code==="KeyS"||code==="Escape")) storySkip();
  else if(state==="over"&&(code==="Enter"||code==="Space")) startGame(false);
  else if(state==="cutscene"&&(code==="Enter"||code==="Space")) cutAdvance(false);
  else if(state==="cutscene"&&(code==="KeyS"||code==="Escape")) skipCutscene(false);
  else if(state==="victory"&&(code==="Enter"||code==="Space")) dismissVictory();
  else if(state==="levelup"){
    if(code==="Digit1"||code==="Numpad1") pickIdx(0);
    if(code==="Digit2"||code==="Numpad2") pickIdx(1);
    if(code==="Digit3"||code==="Numpad3") pickIdx(2);
  }else if(code==="Escape"||code==="KeyP"){
    if(state==="play"||state==="pause") togglePause();
  }else if(state==="play"){
    if(code==="Space"||code==="ShiftLeft"||code==="ShiftRight") tryDash();
    if(code==="KeyQ") trySkill("shock");
    if(code==="KeyE") trySkill("shield");
    if(code==="KeyR") trySkill("change");
  }
}
function onPointer(x,y,isTouch,id){
  mouse.x=x;mouse.y=y;
  if(state==="title"){openParty();return;}
  if(state==="party"){onPartyPointer(x,y);return;}
  if(state==="notice"||state==="story"||state==="chapter"){onStoryPointer(x,y);return;}
  if(state==="over"){startGame(false);return;}
  if(state==="cutscene"){onCutscenePointer(x,y);return;}
  if(state==="victory"){onVictoryPointer(x,y);return;}
  if(state==="levelup"){pickCardAt(x,y);return;}
  if(state==="pause"){
    if(hitRect(x,y,uiResume)||hitCirc(x,y,uiPause,10)) togglePause();
    return;
  }
  if(state==="play"){
    if(hitCirc(x,y,uiPause,10)){togglePause();return;}
    if(isTouchUI()){
      for(let i=0;i<uiSkills.length;i++){
        if(hitCirc(x,y,uiSkills[i],8)){skillHeld[uiSkills[i].id]=false;trySkill(uiSkills[i].id);return;}
      }
      if(hitCirc(x,y,uiDash,12)){
        if(isTouch) dashTouchId=id;
        tryDash();
        return;
      }
    }
    if(isTouch&&x<W*0.5){startJoy(id,x,y);return;}
  }
}
function startJoy(id,x,y){
  const r=Math.max(56,Math.min(W,H)*0.16);
  const ins=getInsets();
  const cx=clamp(x,ins.l+r+8,W*0.5-8);
  const cy=clamp(y,ins.t+r+8,H-ins.b-r-8);
  joy={active:true,id,cx,cy,x:cx,y:cy,dx:0,dy:0,r};
  moveJoy(x,y);
}
function moveJoy(x,y){
  const dx=x-joy.cx,dy=y-joy.cy,l=Math.hypot(dx,dy),max=joy.r,dead=10;
  const k=l>max?max/l:1;
  joy.x=joy.cx+dx*k;joy.y=joy.cy+dy*k;
  if(l<dead){joy.dx=0;joy.dy=0;}
  else{
    const n=norm(dx,dy);
    const mag=clamp((Math.min(l,max)-dead)/(max-dead),0,1);
    joy.dx=n.x*mag;joy.dy=n.y*mag;
  }
}
function endJoy(){joy.active=false;joy.id=null;joy.dx=0;joy.dy=0;}



let state="title",time=0,kills=0,shake=0,titleT=0,grace=0;
let player,enemies=[],bullets=[],gems=[],particles=[],floats=[],afterimages=[],rings=[],zaps=[];
let cards=[],cardRects=[],spawnAcc=0,eliteAcc=0;
const cam={x:0,y:0};

function reset(){
  player={
    x:0,y:0,r:16,facing:0,
    hp:100,maxHp:100,spd:215,atk:15,rate:0.40,proj:1,pierce:0,
    pickup:95,xp:0,level:1,next:8,
    dashCd:0,dashMaxCd:1.55,dashCharges:1,dashMax:1,dashDur:0.16,dashVamp:0,
    dashT:0,iframe:0,dashDmg:24,vamp:0,fireCd:0,
    dashVx:0,dashVy:0,dashed:null,
    wep:{bolt:1}, pas:{regen:1}, wepCd:{}, auraT:0,
    skillCd:{shock:0,shield:0,change:0,chain:0}, shieldT:0, magnetT:0, skin:'hero', buddy:null, changeCd:0
  };
  enemies=[];bullets=[];gems=[];particles=[];floats=[];afterimages=[];rings=[];zaps=[];beams=[];wprojs=[];mines=[];meteors=[];fburn=[];pickups=[];
  time=0;kills=0;shake=0;spawnAcc=0;eliteAcc=0;grace=0.25;
  cam.x=0;cam.y=0;cards=[];cardRects=[];
  endJoy();dashHeld=false;dashTouchId=null;skillHeld=Object.create(null);
  neonBase=null;arriveShown=false;arriveBtns=[];
  eprojs=[];cutI=0;cutT=0;cutAuto=-1;boomCueT=0;boomGranted=false;bossDefeated=false;victoryBtns=[];stepAnim=null;
  camAim={x:null,y:null,k:8};
  chapterN=1;chapterTitle='챕터 1: speed';speedJoined=false;cutKind='arrive';cutScene='world';
  speedBase=null;normalBossDown=false;hardBossDown=false;midBossSpawned=false;magDropT=0;btnFlash=0;interiorFade=0;
  speedArrived=false;victoryKind='seb';changeFlash=0;pickups=[];ch2Continue=false;
}
function startGame(fromOpening){
  ensureAudio();
  tryFullscreen();
  hideJoinInput();
  reset();
  if(net.role==="host"||net.role==="client") setupAllies();
  else allies=[];
  placeNeonBase();
  state="play";
  beep(420,0.1,"square",0.07,880);
  burst((player&&player.x)||0,(player&&player.y)||0,"#5ee7ff",24,220,0.45);
}
function togglePause(){
  if(state==="play"){state="pause";endJoy();beep(320,0.08,"triangle",0.05);}
  else if(state==="pause"){state="play";last=performance.now();beep(520,0.08,"triangle",0.05);}
}

function wrld(x,y){
  const jx=shake?(Math.random()-0.5)*shake*scale:0;
  const jy=shake?(Math.random()-0.5)*shake*scale:0;
  return {x:(x-cam.x)*scale+W/2+jx,y:(y-cam.y)*scale+H/2+jy};
}
function viewSize(){return {w:W/scale,h:H/scale};}

const MAX_PART=140,MAX_FLOAT=40,MAX_RING=12,MAX_AFTER=16,MAX_BULLET=80;
const poolP=[],poolF=[],poolR=[],poolA=[],poolB=[];
function poget(pool){return pool.pop()||{};}
function porel(pool,o){pool.push(o);}
function arrRel(arr,i,pool){
  const o=arr[i],last=arr.pop();
  if(i<arr.length) arr[i]=last;
  if(pool) porel(pool,o);
  return o;
}

const _spr=new Map();
function spr(key,w,h,pad,draw){
  let c=_spr.get(key);
  if(c) return c;
  const s=Math.ceil(Math.max(2,w,h)+pad*2);
  const cv=document.createElement("canvas");
  cv.width=s;cv.height=s;
  const g=cv.getContext("2d");
  g.translate(s/2,s/2);
  draw(g);
  _spr.set(key,cv);
  return cv;
}
function blit(img,x,y,sc){
  const s=sc||1,w=img.width*s,h=img.height*s;
  ctx.drawImage(img,x-w/2,y-h/2,w,h);
}
function particleSpr(col){
  return spr("p"+col,8,8,10,g=>{
    g.shadowColor=col;g.shadowBlur=8;g.fillStyle=col;
    g.beginPath();g.arc(0,0,3,0,Math.PI*2);g.fill();g.shadowBlur=0;
  });
}
function gemSpr(){
  return spr("gem",14,14,16,g=>{
    g.shadowColor="#7cff6b";g.shadowBlur=10;g.fillStyle="#7cff6b";
    g.beginPath();g.moveTo(0,-6);g.lineTo(5,0);g.lineTo(0,6);g.lineTo(-5,0);g.closePath();g.fill();g.shadowBlur=0;
  });
}
function enemySpr(col,r,elite){
  const blur=elite?16:10;
  return spr("e"+col+"_"+r+(elite?1:0),r*2+(elite?10:0),r*2+(elite?10:0),blur+6,g=>{
    g.shadowColor=col;g.shadowBlur=blur;g.fillStyle=col;
    g.beginPath();g.arc(0,0,r,0,Math.PI*2);g.fill();
    if(elite){g.shadowColor="#ffd166";g.shadowBlur=8;g.strokeStyle="#ffd166";g.lineWidth=2;g.beginPath();g.arc(0,0,r+5,0,Math.PI*2);g.stroke();}
    g.shadowBlur=0;
  });
}
function boltSpr(){
  return spr("bolt",36,16,16,g=>{
    g.shadowColor="#4df3ff";g.shadowBlur=14;g.fillStyle="rgba(77,243,255,0.45)";
    g.beginPath();g.ellipse(-6,0,14,4,0,0,Math.PI*2);g.fill();
    g.fillStyle="#e8ffff";g.beginPath();g.arc(0,0,4.5,0,Math.PI*2);g.fill();g.shadowBlur=0;
  });
}
function bladeSpr(){
  return spr("blade",16,36,16,g=>{
    g.shadowColor="#b9f";g.shadowBlur=14;g.fillStyle="#d9c2ff";
    g.beginPath();g.moveTo(0,-16);g.lineTo(5,0);g.lineTo(0,16);g.lineTo(-5,0);g.closePath();g.fill();
    g.fillStyle="#fff";g.beginPath();g.arc(0,0,2.5,0,Math.PI*2);g.fill();g.shadowBlur=0;
  });
}
function auraSpr(){
  return spr("aura",240,240,2,g=>{
    const gd=g.createRadialGradient(0,0,24,0,0,120);
    gd.addColorStop(0,"rgba(255,122,60,0.04)");
    gd.addColorStop(0.75,"rgba(255,122,60,0.14)");
    gd.addColorStop(1,"rgba(255,122,60,0.3)");
    g.fillStyle=gd;g.beginPath();g.arc(0,0,120,0,Math.PI*2);g.fill();
  });
}

const CELL=96;
let _grid=null;
function gk(cx,cy){return ((cx+32768)<<16)|(cy+32768);}
function buildGrid(){
  const map=new Map(),list=enemies,cell=CELL;
  for(let i=0,n=list.length;i<n;i++){
    const e=list[i];e._i=i;
    const cx=Math.floor(e.x/cell),cy=Math.floor(e.y/cell);
    const k=gk(cx,cy);let b=map.get(k);if(!b){b=[];map.set(k,b);}b.push(e);
  }
  _grid=map;return map;
}
function gridQuery(x,y,r,out){
  const cell=CELL,map=_grid,res=out||[];
  res.length=0;
  if(!map) return res;
  const x0=Math.floor((x-r)/cell),x1=Math.floor((x+r)/cell);
  const y0=Math.floor((y-r)/cell),y1=Math.floor((y+r)/cell);
  for(let cx=x0;cx<=x1;cx++){
    for(let cy=y0;cy<=y1;cy++){
      const b=map.get(gk(cx,cy));
      if(!b) continue;
      for(let i=0;i<b.length;i++) res.push(b[i]);
    }
  }
  return res;
}

  const vs=viewSize();
  const dist=Math.max(vs.w,vs.h)*0.58+rand(30,140);
  const x=player.x+Math.cos(a)*dist;
  const y=player.y+Math.sin(a)*dist;
  let e;
  if(kind==="runner") e={x,y,r:11,hp:12,spd:175,dmg:9,xp:1,col:"#ffd84d",kind,hit:0};
  else if(kind==="tank") e={x,y,r:22,hp:80,spd:68,dmg:20,xp:3,col:"#b46bff",kind,hit:0};
  else if(kind==="elite") e={x,y,r:28,hp:230,spd:92,dmg:28,xp:10,col:"#ffcf40",kind,hit:0,elite:true};
  else e={x,y,r:14,hp:18,spd:108,dmg:13,xp:1,col:"#ff4d6d",kind:"grunt",hit:0};
  // v20: Ch1 regulars tougher + faster ramp. Ch2 regulars stay harder. Bosses/minions unchanged.
  const ts=1+time/70*Math.min(1,0.7+0.4*time/130);
  const ch2=typeof chapterN==="number"&&chapterN>=2;
  const chMul=ch2?1.25:1;
  e.hp=Math.round(e.hp*ts*chMul);
  e.max=e.hp;
  e.dmg=Math.round(e.dmg*(1+time/120)* (ch2?1.2:1));
  enemies.push(e);
}

function buildLevelPool(){
  const pool=[];
  for(const id of Object.keys(player.wep||{})){
    const def=WEAPONS[id];if(!def) continue;
    const lv=wepLv(id);
    if(lv<MAXLV) pool.push({id:"wup_"+id,name:def.name+" Lv."+(lv+1),desc:def.desc,col:def.col,kind:"wup",wid:id});
  }
  {const full=wepCount()>=MAX_WEAPONS;
    for(const id of Object.keys(WEAPONS)){
      if(!wepLv(id)&&(!full||WEAPONS[id].sub)){const def=WEAPONS[id];
        pool.push({id:"wnew_"+id,name:"새 무기: "+def.name,desc:def.desc,col:def.col,kind:"wnew",wid:id});}
    }
  }
  for(const id of Object.keys(PASSIVES)){
    const p=PASSIVES[id];if(p.off) continue;
    const lv=pasLv(id);
    if(lv<MAXLV) pool.push({id:"pas_"+id,name:p.name+(lv?" Lv."+(lv+1):""),desc:p.desc,col:p.col,kind:"pas",pid:id});
  }
  for(const u of DASH_UPS){
    if(u.id==="charge"&&player.dashMax>=3) continue;
    if(u.id==="dashlen"&&(player.dashDur||0.16)>=0.24) continue;
    if(u.id==="dashvamp"&&(player.dashVamp||0)>=3) continue;
    pool.push(u);
  }
  return pool;
}

function tryDash(who,fromNet){
  if(state!=="play"||grace>0) return;
  const P=who||player;
  if(!P) return;
  if(!fromNet){if(dashHeld) return;dashHeld=true;}
  if(P.dashT>0||P.dashCharges<=0) return;
  if(!fromNet&&isNetClient()){netSend({t:"dash"});/* predict below */}
  let dx=0,dy=0;
  if(!who||who===player){
    if(keys.KeyW||keys.ArrowUp) dy-=1;
    if(keys.KeyS||keys.ArrowDown) dy+=1;
    if(keys.KeyA||keys.ArrowLeft) dx-=1;
    if(keys.KeyD||keys.ArrowRight) dx+=1;
    if(joy.active&&(joy.dx||joy.dy)){dx=joy.dx;dy=joy.dy;}
  }else{
    dx=P.mx||0;dy=P.my||0;
  }
  let n;
  if(dx||dy) n=norm(dx,dy);
  else n={x:Math.cos(P.facing),y:Math.sin(P.facing)};
  if(!n.x&&!n.y) n={x:1,y:0};
  const dd=P.dashDur||0.16; // v18 대시 연장
  P.dashT=dd;
  P.iframe=0.22+(dd-0.16);
  P.dashCharges--;
  P.dashVx=n.x*1020;
  P.dashVy=n.y*1020;
  P.facing=Math.atan2(n.y,n.x);
  P.dashed=new Set();
  if(P===player) shake=Math.max(shake,5);
  ring(P.x,P.y,"#5ee7ff",70);
  beep(220,0.13,"sawtooth",0.07,70);
  vibe(15);
}

function trySkill(id,who,fromNet){
  if(state!=="play") return;
  const P=who||player;
  if(id==="shock"&&typeof isSpeedForm==="function"&&isSpeedForm(P)) id="chain";
  if(id==="change"){if(typeof tryChange==="function") tryChange(P,fromNet);return;}
  if(id==="chain"){if(typeof tryChainSkill==="function") tryChainSkill(P,fromNet);return;}
  if(!fromNet){if(skillHeld[id]) return;skillHeld[id]=true;}
  const def=SKILLS.find(s=>s.id===id);
  if(!def||!P) return;
  if((P.skillCd[id]||0)>0) return;
  if(!fromNet&&isNetClient()){netSend({t:"sk",id});}
  P.skillCd[id]=def.cd;
  if(id==="shock"){
    const rad=210,dmg=P.atk*2.4;
    ring(P.x,P.y,"#ff5ea8",rad);
    ring(P.x,P.y,"#ffd166",Math.floor(rad*0.55));
    burst(P.x,P.y,"#ff5ea8",28,300,0.4);
    if(P===player) shake=Math.max(shake,10);
    beep(160,0.16,"sawtooth",0.08,50);
    vibe(25);
    if(isSimHost()){
      for(let i=enemies.length-1;i>=0;i--){
        const e=enemies[i];
        const d=Math.hypot(e.x-P.x,e.y-P.y);
        if(d<rad+e.r){
          const n=norm(e.x-P.x,e.y-P.y);
          const k=1-d/(rad+e.r);
          e.x+=n.x*(80+100*k);e.y+=n.y*(80+100*k);
          hurtEnemy(e,i,dmg,"#ff5ea8");
        }
      }
    }
  }else if(id==="shield"){
    P.shieldT=2.3;
    ring(P.x,P.y,"#5ee7ff",56);
    burst(P.x,P.y,"#5ee7ff",16,180,0.35);
    beep(620,0.12,"triangle",0.07,900);
    vibe(12);
  }
}

function offerLevelup(){
  state="levelup";
  endJoy();
  const pool=buildLevelPool();
  const weps=pool.filter(c=>c.kind==="wup"||c.kind==="wnew");
  const stats=pool.filter(c=>c.kind!=="wup"&&c.kind!=="wnew");
  cards=[];
  if(cards.length<3&&weps.length) cards.push(weps.splice(randi(0,weps.length-1),1)[0]);
  const rest=weps.concat(stats);
  while(cards.length<3&&rest.length) cards.push(rest.splice(randi(0,rest.length-1),1)[0]);
  beep(523,0.12,"triangle",0.08,1046);
  vibe(25);
}
function pickIdx(i){

}
function pickCardAt(x,y){
  for(let i=0;i<cardRects.length;i++){
    const r=cardRects[i];
    if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h){applyUpgrade(cards[i]);return;}
  }
}
function applyUpgrade(u){
  if(u.kind==="wnew"){player.wep[u.wid]=1;player.wepCd[u.wid]=0.3;}
  else if(u.kind==="wup") player.wep[u.wid]=Math.min(MAXLV,(player.wep[u.wid]||1)+1);
  else if(u.kind==="pas"){
    const lv=Math.min(MAXLV,pasLv(u.pid)+1);player.pas[u.pid]=lv;
    if(u.pid==="speed") player.spd=215*(1+0.08*lv);
    else if(u.pid==="heart"){player.maxHp+=20;player.hp=Math.min(player.maxHp,player.hp+20);}
    else if(u.pid==="magnet") player.pickup=95*(1+0.3*lv);
  }else switch(u.id){
    case "dashcd": player.dashMaxCd=Math.max(0.5,player.dashMaxCd*0.75); break;
    case "dashdmg": player.dashDmg*=1.7; break;
    case "charge": player.dashMax+=1; player.dashCharges+=1; break;
    case "dashlen": player.dashDur=Math.min(0.24,(player.dashDur||0.16)+0.04); break;
    case "dashvamp": player.dashVamp=Math.min(3,(player.dashVamp||0)+1); break;
  }
  burst(player.x,player.y,u.col,20,200,0.4);
  state="play";
  last=performance.now();
  cards=[];cardRects=[];
  beep(880,0.08,"square",0.06);
}

function gainXp(n,who){
  const P=who||player;
  if(!P) return;
  const prev=player;player=P;
  player.xp+=n;
  let leveled=false;
  while(player.xp>=player.next){
    player.xp-=player.next;
    player.level++;
    player.next=Math.floor(8*Math.pow(1.34,player.level-1));
    offerLevelup();
    leveled=true;
    levelupWho=P.id||null;
    if(isNetHost()) bcast({t:"lv",id:P.id,cards});
  }
  const remote=P.id&&P.id!==myId;
  if(remote){player=prev;if(leveled)state="play";}
  else player=P;
}

function hurtPlayer(dmg,ex,ey,who){
  const P=who||player;
  if(!P||P.iframe>0) return;
  if(P.shieldT>0){
    burst(P.x,P.y,"#5ee7ff",10,160,0.25);
    beep(880,0.06,"triangle",0.05);
    return;
  }
  const prev=player;player=P;
  dmg*=Math.max(0.3,1-0.07*pasLv("armor"));
  player=prev;
  P.hp-=dmg;
  P.iframe=0.45;
  if(P===player) shake=Math.max(shake,8);
  const n=norm(P.x-ex,P.y-ey);
  P.x+=n.x*28;P.y+=n.y*28;
  burst(P.x,P.y,"#ff4d6d",14,200,0.35);
  beep(140,0.15,"sawtooth",0.08,60);
  vibe(40);
  if(P.hp<=0){
    P.hp=0;
    if(!partyUnits().length){
      state="over";
      endJoy();
      burst(P.x,P.y,"#5ee7ff",40,320,0.7);
      ring(P.x,P.y,"#ff4d6d",160);
      beep(200,0.4,"sawtooth",0.1,40);
      vibe([80,40,140]);
      if(isNetHost()) bcast({t:"over",kills,time});
    }
  }
}

function killEnemy(e,i){
  if(i==null||enemies[i]!==e) i=enemies.indexOf(e);
  if(i<0) return;
  enemies.splice(i,1);
  kills++;
  burst(e.x,e.y,e.col,e.kind==="tank"?18:9,180,0.5,3); // v10 1편 처치 파티클
  gems.push({x:e.x,y:e.y,v:e.xp,vy:-40,life:0.12});
  if(e.xp>=3) gems.push({x:e.x+rand(-8,8),y:e.y+rand(-8,8),v:Math.max(1,e.xp-2),vy:-20,life:0.08});
  if(player.vamp>0){
    const heal=player.vamp;
    player.hp=Math.min(player.maxHp,player.hp+heal);
    floatText(player.x,player.y-24,"+"+heal,"#5dff8a",20);
  }
  beep(e.elite?180:320,0.07,"triangle",0.04,90);
  if(typeof dropMagnet==="function") dropMagnet(e);
  if(e.kind==="seb"||(e.boss&&e.kind!=="ns1boss")) onDefeatSuperEliteBoss(false);
  if(e.kind==="ns1boss"){if(e.hard) hardBossDown=true; else normalBossDown=true;}
}

function update(dt){
  titleT+=dt;
  if(state==="title"||state==="over"||state==="party"||state==="notice"||state==="story"){
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
      if(p.life<=0) arrRel(particles,i,poolP);
    }
    return;
  }
  if(state==="chapter"){tickStory(dt);return;}
  if(state==="cutscene"){tickCutscene(dt);return;}
  if(state==="levelup"||state==="pause"||state==="victory") return;
  if(levelupWho&&levelupWho!==myId){if(isNetHost()){netSendT+=dt;if(netSendT>=0.08){netSendT=0;sendSnap();}}return;}
  if(isNetClient()){clientPlay(dt);return;}

  time+=dt;
  grace=Math.max(0,grace-dt);
  shake=Math.max(0,shake-dt*28);
  if(player.skillCd){
    for(const k of Object.keys(player.skillCd)) player.skillCd[k]=Math.max(0,player.skillCd[k]-dt);
  }
  player.shieldT=Math.max(0,(player.shieldT||0)-dt);
  player.magnetT=Math.max(0,(player.magnetT||0)-dt);

  let mx=0,my=0;
  if(keys.KeyW||keys.ArrowUp) my-=1;
  if(keys.KeyS||keys.ArrowDown) my+=1;
  if(keys.KeyA||keys.ArrowLeft) mx-=1;
  if(keys.KeyD||keys.ArrowRight) mx+=1;
  if(joy.active){mx+=joy.dx;my+=joy.dy;}
  if(player.dashT>0){
    player.dashT-=dt;
    player.x+=player.dashVx*dt;
    player.y+=player.dashVy*dt;
    if(afterimages.length>=MAX_AFTER) arrRel(afterimages,0,poolA);
    const ai=poget(poolA);ai.x=player.x;ai.y=player.y;ai.life=0.22;ai.ang=player.facing;afterimages.push(ai);
    for(let i=enemies.length-1;i>=0;i--){
      const e=enemies[i];
      if(player.dashed.has(e)) continue;
      const ddr=e.r+player.r+8,ddx=e.x-player.x,ddy=e.y-player.y;
      if(ddx*ddx+ddy*ddy<ddr*ddr){
        player.dashed.add(e);
        const dmg=player.dashDmg;
        e.hp-=dmg;e.hit=0.12;
        floatText(e.x,e.y-e.r,String(Math.round(dmg)),"#ffffff",14);
        burst(e.x,e.y,"#5ee7ff",8,200,0.25);
        const n=norm(e.x-player.x,e.y-player.y);
        e.x+=n.x*36;e.y+=n.y*36;
        if(player.dashVamp>0&&player.hp>0&&player.hp<player.maxHp){player.hp=Math.min(player.maxHp,player.hp+player.dashVamp);floatText(player.x,player.y-player.r-6,"+"+player.dashVamp,"#7dffb3",12);}
        if(e.hp<=0) killEnemy(e,i);
      }
    }
  }else{
    const raw=Math.hypot(mx,my);
    if(raw>0.001){
      const n=norm(mx,my);
      const mag=clamp(raw,0,1);
      player.x+=n.x*player.spd*mag*dt;
      player.y+=n.y*player.spd*mag*dt;
      player.facing=Math.atan2(n.y,n.x);
    }
  }

  player.iframe=Math.max(0,player.iframe-dt);
  if(player.dashCharges<player.dashMax){
    player.dashCd+=dt;
    if(player.dashCd>=player.dashMaxCd){
      player.dashCd=0;
      player.dashCharges++;
    }
  }else player.dashCd=0;

  cam.x+=(player.x-cam.x)*Math.min(1,dt*8);
  cam.y+=(player.y-cam.y)*Math.min(1,dt*8);

  if(isNetHost()) hostMoveAllies(dt);
  checkArrive();
  if(typeof tickV17==="function") tickV17(dt);
  updateWeapons(dt);

  const fightingSeb=enemies.some(e=>e.kind==="seb");
  const ch2=typeof chapterN==="number"&&chapterN>=2;
  const cap=ch2?130:95;
  const rateMul=ch2?1.7:1;
  if(!fightingSeb){
    const rate=(1.35+Math.min(4.0,time/22))*rateMul;
    spawnAcc+=dt*rate;
    while(spawnAcc>=1 && enemies.length<cap){
      spawnAcc-=1;
      let kind="grunt";
      const r=Math.random();
      if(time>20&&r<0.24) kind="runner";
      else if(time>32&&r<0.40) kind="tank";
      spawnEnemy(kind);
    }
    eliteAcc+=dt;
    const eliteGap=ch2?14+Math.max(0,12-time/10):18+Math.max(0,16-time/10);
    if(eliteAcc>eliteGap && enemies.length<cap){
      eliteAcc=0;
      spawnEnemy("elite");
    }
  }

  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(e.kind==="ns1boss"){if(typeof updateNS1Boss==="function") updateNS1Boss(e,dt);continue;}
    if(e.boss){updateSuperElite(e,dt);continue;}
    if(e.frozen){e.hit=Math.max(0,e.hit-dt);continue;}
    e.hit=Math.max(0,e.hit-dt);
    e.orbCd=Math.max(0,(e.orbCd||0)-dt);
    const tgt=nearestAlly(e.x,e.y);
    const n=norm(tgt.x-e.x,tgt.y-e.y);
    e.x+=n.x*e.spd*dt;
    e.y+=n.y*e.spd*dt;
    let hitP=null;
    for(const u of partyUnits()){
      const pr=e.r+u.r-2,pdx=e.x-u.x,pdy=e.y-u.y;
      if(pdx*pdx+pdy*pdy<pr*pr){hitP=u;break;}
    }
    if(hitP) hurtPlayer(e.dmg,e.x,e.y,hitP);
  }
  updateEprojs(dt);

  buildGrid();
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.life<=0){arrRel(bullets,i,poolB);continue;}
    let dead=false;
    const nearby=gridQuery(b.x,b.y,b.r+32,_q);
    for(let j=nearby.length-1;j>=0;j--){
      const e=nearby[j];
      if(b.hit.has(e)) continue;
      const rr=e.r+b.r,dx=e.x-b.x,dy=e.y-b.y;
      if(dx*dx+dy*dy<rr*rr){
        b.hit.add(e);
        e.hp-=b.dmg;e.hit=0.1;
        floatText(e.x,e.y-e.r,String(Math.round(b.dmg)),"#ffffff",14);
        burst(b.x,b.y,'#4df3ff',3,100,0.2,2);
        if(e.hp<=0) killEnemy(e,e._i);
        if(b.chain&&b.chain>0){
          const nxt=nearestEnemy(b,b.hit);
          if(nxt){
            const a=Math.atan2(nxt.y-b.y,nxt.x-b.x);
            b.vx=Math.cos(a)*640;b.vy=Math.sin(a)*640;
            b.chain--;
          }else dead=true;
        }
        if(b.hit.size>b.pierce){dead=true;break;}
      }
    }
    if(dead) arrRel(bullets,i,poolB);
  }

  for(let i=gems.length-1;i>=0;i--){
    const g=gems[i];
    if(g.life>0){g.life-=dt;g.y+=g.vy*dt;g.vy+=180*dt;}
    const units=partyUnits().length?partyUnits():(player?[player]:[]);
    let best=null,bd=1e15,mag=false;
    for(const u of units){
      const d=Math.hypot(u.x-g.x,u.y-g.y);
      if(u.magnetT>0) mag=true;
      if(d<bd){bd=d;best=u;}
    }
    if(g.mag) mag=true;
    if(best&&(mag||bd<best.pickup+40)){
      const pull=norm(best.x-g.x,best.y-g.y);
      const sp=mag?980:(bd<best.pickup?520:220);
      g.x+=pull.x*sp*dt;g.y+=pull.y*sp*dt;
    }
    if(best&&bd<18){
      gainXp(g.v,best);
      gems.splice(i,1);
      beep(980,0.04,"sine",0.03,1400);
    }
  }

  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.92;p.vy*=0.92;p.life-=dt;
    if(p.life<=0) arrRel(particles,i,poolP);
  }
  for(let i=floats.length-1;i>=0;i--){
    const f=floats[i];
    f.y+=f.vy*dt;f.life-=dt;
    if(f.life<=0) arrRel(floats,i,poolF);
  }
  for(let i=afterimages.length-1;i>=0;i--){
    afterimages[i].life-=dt;
    if(afterimages[i].life<=0) arrRel(afterimages,i,poolA);
  }
  for(let i=rings.length-1;i>=0;i--){
    const r=rings[i];
    r.t+=dt;r.life=r.dur-r.t;if(r.follow&&player){r.x=player.x;r.y=player.y;}
    if(r.life<=0) arrRel(rings,i,poolR);
  }
}

function drawGrid(){ // v9 1편 배경: 80 격자 + 별/십자 장식
  const gs=80,vw=W/scale/2+gs,vh=H/scale/2+gs,L=cam.x-vw,R=cam.x+vw,T=cam.y-vh,B=cam.y+vh;
  const x0=Math.floor(L/gs)*gs,y0=Math.floor(T/gs)*gs;
  const jx=shake?(Math.random()-0.5)*shake*scale:0,jy=shake?(Math.random()-0.5)*shake*scale:0,wrld=(x,y)=>({x:(x-cam.x)*scale+W/2+jx,y:(y-cam.y)*scale+H/2+jy});
  ctx.strokeStyle="rgb(20,18,51)";ctx.lineWidth=2*scale;ctx.beginPath();
  for(let x=x0;x<=R;x+=gs){const a=wrld(x,T),b=wrld(x,B);ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);}
  for(let y=y0;y<=B;y+=gs){const a=wrld(L,y),b=wrld(R,y);ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);}
  ctx.stroke();
  for(let gx=x0;gx<=R;gx+=gs)for(let gy=y0;gy<=B;gy+=gs){const cx=gx/gs|0,cy=gy/gs|0,h=n1Hash(cx,cy);if(h>0.35)continue;
    const h2=n1Hash(cx+911,cy-377),h3=n1Hash(cx-53,cy+1291),dx=gx+h2*gs,dy=gy+h3*gs,r=(1+n1Hash(cx+7,cy+3)*2.5)*scale,c=wrld(dx,dy);
    ctx.fillStyle=h2<0.5?'#2a2260':'#1d3a5a';
    if(h3<0.15){ctx.fillRect(c.x-r*2,c.y-0.5,r*4,1);ctx.fillRect(c.x-0.5,c.y-r*2,1,r*4);}else{ctx.beginPath();ctx.arc(c.x,c.y,r,0,Math.PI*2);ctx.fill();}}
}

function bodySpr(glow){
  const gl=glow||18;
  return spr("body"+gl,40,40,gl*2+8,g=>{
    g.shadowColor="#5ee7ff";g.shadowBlur=gl;
    g.fillStyle="#d8ffff";
    g.beginPath();g.moveTo(16,0);g.lineTo(0,11);g.lineTo(-12,0);g.lineTo(0,-11);g.closePath();g.fill();
    g.shadowBlur=0;
    g.fillStyle="#4adfff";
    g.beginPath();g.moveTo(9,0);g.lineTo(0,6);g.lineTo(-6,0);g.lineTo(0,-6);g.closePath();g.fill();
    g.fillStyle="#fff";g.beginPath();g.arc(4,0,2.6,0,Math.PI*2);g.fill();
  });
}
function drawBody(x,y,ang,alpha,glow){
  const img=bodySpr(glow||18);
  const s=Math.max(0.85,scale);
  ctx.save();
  ctx.translate(x,y);ctx.rotate(ang);ctx.globalAlpha=alpha;
  const w=img.width*s,h=img.height*s;
  ctx.drawImage(img,-w/2,-h/2,w,h);
  ctx.restore();
}

function rounded(x,y,w,h,r){
  const rr=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+rr,y);
  ctx.arcTo(x+w,y,x+w,y+h,rr);
  ctx.arcTo(x+w,y+h,x,y+h,rr);
  ctx.arcTo(x,y+h,x,y,rr);
  ctx.arcTo(x,y,x+w,y,rr);
  ctx.closePath();
}

function draw(){
  ctx.fillStyle="#07060f";
  ctx.fillRect(0,0,W,H);
  if(state==="title"){drawTitle();return;}
  if(state==="party"){drawParty();return;}
  if(state==="notice"){drawNotice();return;}

    return;
  }

  drawGrid();
  drawNeonBase();
  if(typeof drawSpeedBase==="function") drawSpeedBase();

  // v8 지뢰 (1편 그림)
  for(const m of mines){const c=wrld(m.x,m.y);const blink=m.t<0.4?0.4:(Math.sin(time*10+m.x)>0?1:0.55);ctx.fillStyle="rgba(255,93,93,"+blink+")";ctx.beginPath();ctx.arc(c.x,c.y,7*scale,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="rgba(255,93,93,.5)";ctx.lineWidth=2;ctx.beginPath();ctx.arc(c.x,c.y,11*scale,0,Math.PI*2);ctx.stroke();}

  for(const m of meteors){if(m.t<0)continue;const k=Math.min(1,Math.max(0,m.t)/m.warn),c=wrld(m.x,m.y),R=m.rad*scale;
    ctx.fillStyle="rgba(255,154,93,"+(0.06+0.16*k)+")";ctx.beginPath();ctx.arc(c.x,c.y,R,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="rgba(255,154,93,.8)";ctx.lineWidth=2;ctx.beginPath();ctx.arc(c.x,c.y,R,0,Math.PI*2);ctx.stroke();ctx.fillStyle="rgba(255,200,120,.3)";ctx.beginPath();ctx.arc(c.x,c.y,R*k,0,Math.PI*2);ctx.fill();}
  for(const g of gems){ // v9 1편 보석 (값에 따라 파랑/초록/분홍)
    const s=wrld(g.x,g.y),sp=N1S[g.v>=20?'gem3':g.v>=5?'gem2':'gem1'],sz=sp.size*(g.v>=20?1.4:1)*scale;
    ctx.drawImage(sp.c,s.x-sz/2,s.y-sz/2,sz,sz);
  }

  for(const e of enemies){ // v9 1편 적 모양 (일반=원형, 러너=박쥐, 탱크=육각, 엘리트=왕관)
    if(e.kind==='ns1boss'){if(typeof drawNS1Boss==='function')drawNS1Boss(e);continue;}
    if(e.boss||e.kind==='seb'){drawSuperElite(e);continue;}
    const s=wrld(e.x,e.y),k=N1K[e.kind]||'grunt',t=N1T[k],sp=N1S[k+(e.hit>0?'_f':'')],f=e.r/t.r*scale;
    const wob=k==='bat'?Math.sin(time*20+e.x)*0.15:0,w=sp.size*f*(1+wob),h=sp.size*f;
    ctx.drawImage(sp.c,s.x-w/2,s.y-h/2,w,h);
    if(k==='elite'){const bw=64*f,bh=6*scale,by=s.y-(e.r+14)*scale;ctx.fillStyle="#000a";ctx.fillRect(s.x-bw/2,by,bw,bh);ctx.fillStyle="#ffcf40";ctx.fillRect(s.x-bw/2,by,bw*Math.max(0,e.hp/e.max),bh);}
    else if(k==='brute'&&e.hp<e.max){const bw=32*f,bh=4*scale,by=s.y-(e.r+10)*scale;ctx.fillStyle="#000a";ctx.fillRect(s.x-bw/2,by,bw,bh);ctx.fillStyle="#b46bff";ctx.fillRect(s.x-bw/2,by,bw*Math.max(0,e.hp/e.max),bh);}
  }
  drawEprojs();

  drawFlame();
  if(player&&wepLv("aura")){
    const as=wstat("aura"),R=as.rad*areaMul(),c=wrld(player.x,player.y);
    const sc=(R*scale)/120;
    blit(auraSpr(),c.x,c.y,sc);
    ctx.strokeStyle="rgba(255,154,90,"+(0.45+Math.sin(time*6)*0.15)+")";ctx.lineWidth=2;ctx.setLineDash([10,8]);ctx.lineDashOffset=-time*30;
    ctx.beginPath();ctx.arc(c.x,c.y,R*scale,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
  }
  // v10 1편 그리기 코드 이식: 월드 좌표계로 그림 (lighter 합성)
  {const jx=shake?(Math.random()-0.5)*shake*scale:0,jy=shake?(Math.random()-0.5)*shake*scale:0,TAU=Math.PI*2;
  ctx.save();ctx.translate(W/2-cam.x*scale+jx,H/2-cam.y*scale+jy);ctx.scale(scale,scale);
  ctx.globalCompositeOperation='lighter';
  // 마법 화살 (1편 glowDot 둥근 빛 점)
  {const sp=N1S.bolt;for(const b of bullets){ctx.drawImage(sp.c,b.x-sp.size/2,b.y-sp.size/2,sp.size,sp.size);}}
  ctx.restore();}
  // v8 부메랑·유도 구체
  if(wprojs.length){const bsp=boomSpr(),ssp=seekSpr();ctx.save();ctx.globalCompositeOperation='lighter';

function spacedText(t,x,y,tracking){
  const chs=[...t];
  ctx.save();
  const widths=chs.map(ch=>ctx.measureText(ch).width);
  const total=widths.reduce((a,b)=>a+b,0)+tracking*(chs.length-1);
  let cx=x-total/2;
  for(let i=0;i<chs.length;i++){ctx.fillText(chs[i],cx+widths[i]/2,y);cx+=widths[i]+tracking;}
  ctx.restore();
}

let peer=null,conns=[],hostConn=null,net={role:null,code:null},lobby={players:[]},myId='p0';

function genPartyCode(){let s='';for(let k=0;k<4;k++)s+=NS2_ALPH[Math.random()*NS2_ALPH.length|0];return s}
function isNetHost(){return net.role==='host'}
function isNetClient(){return net.role==='client'}
function isSimHost(){return net.role!=='client'}
function isStoryHost(){return net.role!=='client'}
function partyUnits(){if(allies&&allies.length)return allies.filter(p=>p&&p.hp>0);return (player&&player.hp>0)?[player]:[]}
function nearestAlly(x,y){const list=partyUnits();let best=list[0]||player,bd=1e15;for(const p of list){const d=(p.x-x)*(p.x-x)+(p.y-y)*(p.y-y);if(d<bd){bd=d;best=p}}return best||player}
function hideJoinInput(){const el=document.getElementById('joinCode');if(!el)return;el.style.display='none';joinInputOn=false;try{el.blur()}catch(e){}}
function showJoinInput(){
  const el=document.getElementById('joinCode');if(!el)return;
  joinInputOn=true;
  const ins=getInsets();
  const bw=Math.min(280,W-ins.l-ins.r-40),bh=Math.max(48,Math.min(H,W)*0.1);
  const x=(W/2-bw/2)+(parseFloat(canvas.style.left)||0), y=H*0.46+(parseFloat(canvas.style.top)||0);
  el.style.display='block';
  el.style.left=x+'px';el.style.top=y+'px';
  el.style.width=bw+'px';el.style.height=bh+'px';
  el.value=(el.value||'').toUpperCase();
}
function cleanupNet(){
  for(const c of conns)try{c.close()}catch(e){}
  conns=[];try{hostConn&&hostConn.close()}catch(e){}hostConn=null;
  try{peer&&peer.destroy()}catch(e){}peer=null;
  net={role:null,code:null};lobby={players:[]};myId='p0';allies=[];levelupWho=null;
}
function bcast(d){for(const c of conns)if(c.open)try{c.send(d)}catch(e){}}
function netSend(d){if(hostConn&&hostConn.open)try{hostConn.send(d)}catch(e){}}

function beginOpening(){
  hideJoinInput();

function enterChapter(){

}
function storyAdvance(){
  if(!isStoryHost()) return;
  if(state==='notice'){state='story';storyI=0;if(isNetHost())bcast({t:'story',i:0});return;}
  if(state==='story'){
    storyI++;
    if(storyI>=CH1_STORY.length){enterChapter();return;}
    if(isNetHost())bcast({t:'story',i:storyI});
    return;
  }
  if(state==='chapter'){if(typeof chapterN==="number"&&chapterN>=2&&typeof beginChapter2Play==="function") beginChapter2Play(); else beginPlayFromChapter();}
}
function storySkip(){
  if(!isStoryHost()) return;
  if(state==='story'||state==='notice') enterChapter();
}
function beginPlayFromChapter(){
  startGame(true);
  if(isNetHost()) bcast({t:'play',base:packNeonBase()});
}

function mkAlly(lp,i,n){
  const ang=-Math.PI/2+(i*TAU/Math.max(1,n)),rad=54;
  const p={
    id:lp.id,name:lp.name,col:lp.col||NS2_COLS[i%4],
    x:Math.cos(ang)*rad,y:Math.sin(ang)*rad,r:16,facing:0,
    hp:100,maxHp:100,spd:215,atk:15,rate:0.40,proj:1,pierce:0,
    pickup:95,xp:0,level:1,next:8,
    dashCd:0,dashMaxCd:1.55,dashCharges:1,dashMax:1,dashDur:0.16,dashVamp:0,
    dashT:0,iframe:0,dashDmg:24,vamp:0,fireCd:0,
    dashVx:0,dashVy:0,dashed:null,
    wep:{bolt:1}, pas:{regen:1}, wepCd:{}, auraT:0,
    skillCd:{shock:0,shield:0,change:0,chain:0}, shieldT:0, magnetT:0, skin:'hero', buddy:null, changeCd:0,
    mx:0,my:0,left:false
  };
  return p;
}
function setupAllies(){
  const list=lobby.players&&lobby.players.length?lobby.players:[{id:myId||'p0',name:'P1',col:NS2_COLS[0]}];
  allies=list.map((lp,i)=>mkAlly(lp,i,list.length));
  const me=allies.find(p=>p.id===myId)||allies[0];
  player=me;
}

function createRoom(tries){
  tries=tries||0;
  cleanupNet();
  myId='p0';
  lobby.players=[{id:'p0',name:'P1',col:NS2_COLS[0]}];
  if(typeof Peer==='undefined'){partyMsg='PeerJS를 불러오지 못했어요. 인터넷 연결을 확인하세요.';partyView='home';return;}
  const code=genPartyCode();
  net={role:'host',code};const my=net;
  partyView='room';partyMsg='서버 연결 중…';
  const again=()=>{partyMsg='';createRoom();};
  let to=setTimeout(()=>{if(net===my&&!my.open){cleanupNet();partyView='home';partyMsg='서버에 연결할 수 없어요. 다시 시도해 주세요.';}},12000);
  try{peer=new Peer(NS2_PREFIX+code,{debug:0,config:NS2_ICE})}catch(e){clearTimeout(to);cleanupNet();partyView='home';partyMsg='연결 오류';return;}
  peer.on('open',()=>{if(net!==my)return;my.open=true;clearTimeout(to);partyMsg='친구에게 코드를 알려주세요 (최대 4명)';});
  peer.on('connection',c=>{
    if(net!==my)return;
    c.on('open',()=>{
      if(lobby.players.length>=4||state!=='party'){try{c.send({t:'full'})}catch(e){}setTimeout(()=>{try{c.close()}catch(e){}},400);return;}
      let n=0;while(lobby.players.some(p=>p.id==='p'+n))n++;
      const id='p'+n;c.pid=id;conns.push(c);
      lobby.players.push({id,name:'P'+(n+1),col:NS2_COLS[n%4]});
      try{c.send({t:'hello',id,code:net.code,ver:'v20'})}catch(e){}
      syncLobby();
    });
    c.on('data',d=>onHostData(c,d));
    c.on('close',()=>{
      if(!c.pid)return;
      conns=conns.filter(x=>x!==c);
      lobby.players=lobby.players.filter(p=>p.id!==c.pid);
      if(allies&&allies.length){const p=allies.find(p=>p.id===c.pid);if(p){p.hp=0;p.left=true;}}
      if(state==='party') syncLobby();
    });
  });
  peer.on('error',err=>{
    if(net!==my)return;
    if(err.type==='unavailable-id'){if(tries<4){createRoom(tries+1);return;}}
    if(!my.open){clearTimeout(to);cleanupNet();partyView='home';partyMsg='서버 오류('+(err.type||'')+')';}
  });
  peer.on('disconnected',()=>{if(net===my&&peer&&!peer.destroyed)try{peer.reconnect()}catch(e){}});
}
function syncLobby(){bcast({t:'lobby',players:lobby.players,code:net.code});}

function joinRoom(code){
  code=(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length!==4){partyMsg='4자리 코드를 입력하세요';return;}
  cleanupNet();
  if(typeof Peer==='undefined'){partyMsg='PeerJS를 불러오지 못했어요. 인터넷 연결을 확인하세요.';return;}
  net={role:'client',code};const my=net;
  partyView='join';partyMsg='접속 중…';
  const to=setTimeout(()=>{if(net===my&&!my.ok){cleanupNet();partyView='join';partyMsg='시간 초과. 코드와 인터넷을 확인하세요.';showJoinInput();}},12000);
  try{peer=new Peer({debug:0,config:NS2_ICE})}catch(e){clearTimeout(to);partyMsg='연결 오류';return;}
  peer.on('open',()=>{
    if(net!==my)return;
    hostConn=peer.connect(NS2_PREFIX+code,{serialization:'json',reliable:true});
    hostConn.on('data',d=>{if(net!==my)return;onClientData(d)});
    hostConn.on('open',()=>{my.ok=true;clearTimeout(to);});
    hostConn.on('close',()=>{
      if(net!==my)return;
      const wasPlay=state==='play'||state==='pause'||state==='levelup'||state==='over'||state==='notice'||state==='story'||state==='chapter'||state==='cutscene'||state==='victory';
      cleanupNet();
      state='party';partyView='home';
      partyMsg=wasPlay?'호스트와 연결이 끊어졌어요.':'연결이 끊어졌어요.';
      hideJoinInput();
    });
  });
  peer.on('error',err=>{
    if(net!==my||my.ok)return;
    clearTimeout(to);cleanupNet();partyView='join';showJoinInput();
    partyMsg=err.type==='peer-unavailable'?'방을 찾을 수 없어요':'오류: '+(err.type||'연결 실패');
  });
  peer.on('disconnected',()=>{if(net===my&&peer&&!peer.destroyed)try{peer.reconnect()}catch(e){}});
}

function onClientData(d){
  if(!d||!d.t)return;
  if(d.t==='full'){partyMsg='방이 가득 찼거나 이미 시작했어요.';partyView='join';showJoinInput();return;}
  if(d.t==='hello'){myId=d.id;net.code=d.code||net.code;partyView='room';hideJoinInput();partyMsg='호스트가 시작하기를 기다리는 중…';return;}
  if(d.t==='lobby'){lobby.players=d.players||[];if(d.code)net.code=d.code;return;}
  if(d.t==='begin'){hideJoinInput();state='notice';storyI=0;chapterT=0;ch2Continue=false;return;}
  if(d.t==='cont2'){if(typeof startContinueChapter2==='function') startContinueChapter2(true,d.hostSnap);return;}
  if(d.t==='story'){hideJoinInput();state='story';storyI=d.i|0;return;}
  if(d.t==='chapter'){enterChapter();return;}
  if(d.t==='play'){startGame(true);if(d.base)placeNeonBase(d.base);return;}
  if(d.t==='arrive'){if(d.base)placeNeonBase(d.base);onArriveNeonBase(true);return;}
  if(d.t==='cut'){if(d.kind)cutKind=d.kind;applyCutIndex(d.i|0);return;}
  if(d.t==='cutskip'){if(d.kind)cutKind=d.kind;skipCutscene(true);return;}
  if(d.t==='bossdown'){onDefeatSuperEliteBoss(true);return;}
  if(d.t==='swap'){if(typeof applySwap==="function") applySwap(d,true);return;}
  if(d.t==='chapter2'){if(typeof enterChapter2Card==="function") enterChapter2Card();return;}
  if(d.t==='ch2'){if(typeof beginChapter2Play==="function") beginChapter2Play(true);return;}
  if(d.t==='speedarr'){if(typeof onArriveSpeedBase==="function") onArriveSpeedBase(true);return;}
  if(d.t==='lv'){if(d.id===myId){cards=d.cards||[];state='levelup';}else{levelupWho=d.id;}return;}
  if(d.t==='lvdone'){levelupWho=null;if(state==='levelup'){state='play';last=performance.now();cards=[];}return;}
  if(d.t==='over'){state='over';if(d.kills!=null)kills=d.kills;if(d.time!=null)time=d.time;return;}
  if(d.t==='s'&&(state==='play'||state==='cutscene'||state==='victory')){applySnap(d);}
}
function onHostData(c,d){
  if(!d||!d.t)return;
  if(d.t==='in'){
    const p=allies.find(p=>p.id===c.pid);if(!p)return;
    p.mx=clamp(+d.mx||0,-1,1);p.my=clamp(+d.my||0,-1,1);
    return;
  }
  if(d.t==='dash'){const p=allies.find(p=>p.id===c.pid);if(p) tryDash(p,true);return;}
  if(d.t==='sk'){const p=allies.find(p=>p.id===c.pid);if(p) trySkill(d.id,p,true);return;}
  if(d.t==='swap'){const p=allies.find(p=>p.id===c.pid);if(p&&typeof tryChange==="function") tryChange(p,true);return;}
  if(d.t==='loadout'){const p=allies.find(p=>p.id===c.pid);if(p&&typeof applySnapshot==='function'&&d.snap){applySnapshot(p,d.snap);p.hp=p.maxHp;}return;}
  if(d.t==='pick'){const p=allies.find(p=>p.id===c.pid);if(p&&state==='levelup'&&levelupWho===p.id) applyUpgradeFor(p,cards[d.i|0]);return;}
}

function hostStartParty(){
  if(!isNetHost())return;
  if(!lobby.players.length)return;
  if(typeof hasChapterSave==='function'&&hasChapterSave()){chapterPickFrom='room';partyView='chapter';partyMsg='';return;}
  beginOpening();
}

function applySnap(d){
  if(!d)return;
  if(d.time!=null)time=d.time;
  if(d.kills!=null)kills=d.kills;
  if(Array.isArray(d.pl)){
    if(!allies.length){
      allies=d.pl.map((s,i)=>mkAlly({id:s.id,name:s.name,col:s.col},i,d.pl.length));
      player=allies.find(p=>p.id===myId)||allies[0];
    }
    for(const s of d.pl){
      let p=allies.find(q=>q.id===s.id);
      if(!p){p=mkAlly(s,allies.length,allies.length+1);allies.push(p);}
      if(p.id===myId && player){
        // light reconcile
        p.hp=s.hp;p.maxHp=s.maxHp;p.level=s.level;p.xp=s.xp;p.next=s.next;
        p.dashCharges=s.dashCharges;p.dashT=s.dashT;p.iframe=s.iframe;p.facing=s.facing;
        if(s.dashMax) p.dashMax=s.dashMax; if(s.dashDur) p.dashDur=s.dashDur;
        if(s.skin) p.skin=s.skin;
        if(s.chainCd!=null){p.skillCd=p.skillCd||{};p.skillCd.chain=s.chainCd;}
        if(s.buddy&&typeof applyBuddySnap==="function") applyBuddySnap(p,s.buddy);
        if(Math.hypot((p.x-s.x),(p.y-s.y))>48){p.x=s.x;p.y=s.y;}
        else{p.tx=s.x;p.ty=s.y;}
        player=p;
      }else{
        p.tx=s.x;p.ty=s.y;p.hp=s.hp;p.maxHp=s.maxHp;p.facing=s.facing;p.dashT=s.dashT;p.iframe=s.iframe;p.level=s.level;
        p.name=s.name;p.col=s.col||p.col;
        if(s.skin) p.skin=s.skin;
        if(s.chainCd!=null){p.skillCd=p.skillCd||{};p.skillCd.chain=s.chainCd;}
        if(s.buddy&&typeof applyBuddySnap==="function") applyBuddySnap(p,s.buddy);
      }
    }
  }
  if(Array.isArray(d.en)){
    enemies=d.en.map(s=>({x:s.x,y:s.y,hp:s.hp,max:s.max,r:s.r,kind:s.kind,col:s.col,hit:s.hit||0,elite:!!s.elite,xp:s.xp||1,spd:s.spd||40,orbCd:0,boss:!!s.boss,minion:!!s.minion,frozen:!!s.frozen,atk:s.atk||'idle',atkT:s.atkT||0,warnX:s.warnX,warnY:s.warnY,warnT:s.warnT||0,shotCd:s.shotCd||0,callCd:s.callCd||0,dashVx:s.dashVx||0,dashVy:s.dashVy||0,hard:!!s.hard,dmg:s.dmg||12}));
  }
  if(Array.isArray(d.gem)) gems=d.gem.map(s=>({x:s.x,y:s.y,v:s.v,vy:s.vy||0,life:s.life||0}));
  if(Array.isArray(d.ep)) eprojs=d.ep.map(s=>({x:s.x,y:s.y,vx:s.vx,vy:s.vy,r:s.r||7,life:s.life,dmg:s.dmg||12,col:s.col||'#ff5a4d'}));
  if(Array.isArray(d.pu)&&typeof applyPickupsSnap==="function") applyPickupsSnap(d.pu);
  if(d.base) placeNeonBase(d.base);
  if(d.sbase&&typeof placeSpeedBase==="function") placeSpeedBase(d.sbase);
  if(d.ch!=null) chapterN=d.ch|0;
  if(d.cutKind) cutKind=d.cutKind;
  if(d.speedJoined) {speedJoined=true;if(player&&typeof ensureBuddy==="function") ensureBuddy(player);}
  if(d.skin&&player) player.skin=d.skin;
  if(d.hardDown) hardBossDown=true;
  if(d.arrived && !arriveShown) onArriveNeonBase(true);
  if(d.boom && !boomGranted) grantBoomerangAll();
  if(d.defeated && !bossDefeated) onDefeatSuperEliteBoss(true);
  if(d.cut!=null && state==='cutscene' && (d.cut|0)!==cutI) applyCutIndex(d.cut|0);
  if(d.cam && state==='cutscene'){camAim={x:d.cam.x,y:d.cam.y,k:6};}
}

function sendSnap(){
  if(!isNetHost()||!conns.length)return;
  const pl=(allies.length?allies:[player]).filter(Boolean).map(p=>({id:p.id,name:p.name,col:p.col,x:p.x,y:p.y,hp:p.hp,maxHp:p.maxHp,facing:p.facing,dashT:p.dashT,iframe:p.iframe,level:p.level,xp:p.xp,next:p.next,dashCharges:p.dashCharges,dashMax:p.dashMax,dashDur:p.dashDur||0.16,skin:p.skin||'hero',chainCd:(p.skillCd&&p.skillCd.chain)||0,buddy:p.buddy?{x:p.buddy.x,y:p.buddy.y,facing:p.buddy.facing,skin:p.buddy.skin}:null}));
  const en=enemies.map(e=>({x:e.x,y:e.y,hp:e.hp,max:e.max,r:e.r,kind:e.kind,col:e.col,hit:e.hit,elite:!!e.elite,xp:e.xp,spd:e.spd,boss:!!e.boss,minion:!!e.minion,frozen:!!e.frozen,atk:e.atk,atkT:e.atkT,warnX:e.warnX,warnY:e.warnY,warnT:e.warnT,shotCd:e.shotCd,callCd:e.callCd,dashVx:e.dashVx,dashVy:e.dashVy,hard:!!e.hard}));
  const gem=gems.map(g=>({x:g.x,y:g.y,v:g.v,vy:g.vy,life:g.life}));
  const ep=eprojs.map(p=>({x:p.x,y:p.y,vx:p.vx,vy:p.vy,r:p.r,life:p.life,dmg:p.dmg,col:p.col}));
  const pu=(typeof packPickups==="function")?packPickups():[];
  bcast({t:'s',time,kills,pl,en,gem,ep,pu,base:packNeonBase(),sbase:typeof packSpeedBase==="function"?packSpeedBase():null,arrived:arriveShown,boom:boomGranted,defeated:bossDefeated,cut:cutI,cutKind:cutKind,cam:{x:cam.x,y:cam.y},ch:chapterN,speedJoined:!!speedJoined,skin:player&&player.skin,hardDown:!!hardBossDown});
}
function clientSendInput(){
  if(!isNetClient())return;
  let mx=0,my=0;
  if(keys.KeyW||keys.ArrowUp) my-=1;
  if(keys.KeyS||keys.ArrowDown) my+=1;
  if(keys.KeyA||keys.ArrowLeft) mx-=1;
  if(keys.KeyD||keys.ArrowRight) mx+=1;
  if(joy.active){mx+=joy.dx;my+=joy.dy;}
  netSend({t:'in',mx,my});

function tickStory(dt){

function clientPlay(dt){
  if(!player)return;
  let mx=0,my=0;
  if(keys.KeyW||keys.ArrowUp) my-=1;
  if(keys.KeyS||keys.ArrowDown) my+=1;
  if(keys.KeyA||keys.ArrowLeft) mx-=1;
  if(keys.KeyD||keys.ArrowRight) mx+=1;
  if(joy.active){mx+=joy.dx;my+=joy.dy;}
  if(player.dashT>0){
    player.dashT=Math.max(0,player.dashT-dt);
    player.x+=player.dashVx*dt;player.y+=player.dashVy*dt;
  }else{
    const raw=Math.hypot(mx,my);
    if(raw>0.001){
      const n=norm(mx,my),mag=clamp(raw,0,1);
      player.x+=n.x*player.spd*mag*dt;player.y+=n.y*player.spd*mag*dt;
      player.facing=Math.atan2(n.y,n.x);
    }
    if(player.tx!=null){player.x+=(player.tx-player.x)*Math.min(1,dt*8);player.y+=(player.ty-player.y)*Math.min(1,dt*8);}
  }
  player.iframe=Math.max(0,(player.iframe||0)-dt);
  if(player.skillCd){for(const k of Object.keys(player.skillCd)) player.skillCd[k]=Math.max(0,player.skillCd[k]-dt);}
  player.shieldT=Math.max(0,(player.shieldT||0)-dt);
  player.magnetT=Math.max(0,(player.magnetT||0)-dt);
  if(typeof tickV17Client==="function") tickV17Client(dt);
  for(const p of allies){
    if(p===player) continue;
    if(p.tx!=null){p.x+=(p.tx-p.x)*Math.min(1,dt*12);p.y+=(p.ty-p.y)*Math.min(1,dt*12);}
    p.dashT=Math.max(0,(p.dashT||0)-dt);
  }
  cam.x+=(player.x-cam.x)*Math.min(1,dt*8);
  cam.y+=(player.y-cam.y)*Math.min(1,dt*8);
  netSendT+=dt;
  if(netSendT>=0.05){netSendT=0;clientSendInput();}
}

function hostMoveAllies(dt){
  if(!isNetHost()||!allies.length) return;
  const local=player;
  for(const p of allies){
    if(p.hp<=0||p.left) continue;
    if(p.id===myId){
      // movement already applied to player in the main loop
      p.x=player.x;p.y=player.y;p.facing=player.facing;p.dashT=player.dashT;
      p.hp=player.hp;p.iframe=player.iframe;p.shieldT=player.shieldT;
      continue;
    }
    if(p.dashT>0){
      p.dashT-=dt;p.x+=p.dashVx*dt;p.y+=p.dashVy*dt;
      if(p.dashed){
        for(let i=enemies.length-1;i>=0;i--){
          const e=enemies[i];if(p.dashed.has(e)) continue;
          const ddr=e.r+p.r+8,ddx=e.x-p.x,ddy=e.y-p.y;
          if(ddx*ddx+ddy*ddy<ddr*ddr){
            p.dashed.add(e);e.hp-=p.dashDmg;e.hit=0.12;
            if(p.dashVamp>0&&p.hp>0&&p.hp<p.maxHp) p.hp=Math.min(p.maxHp,p.hp+p.dashVamp); // v18 돌진 흡혈
            floatText(e.x,e.y-e.r,String(Math.round(p.dashDmg)),"#ffffff",14);
            if(e.hp<=0) killEnemy(e,i);
          }
        }
      }
    }else{
      const raw=Math.hypot(p.mx,p.my);
      if(raw>0.001){const n=norm(p.mx,p.my),mag=clamp(raw,0,1);p.x+=n.x*p.spd*mag*dt;p.y+=n.y*p.spd*mag*dt;p.facing=Math.atan2(n.y,n.x);}
    }
    p.iframe=Math.max(0,p.iframe-dt);
    if(p.skillCd){for(const k of Object.keys(p.skillCd)) p.skillCd[k]=Math.max(0,p.skillCd[k]-dt);}
    p.shieldT=Math.max(0,(p.shieldT||0)-dt);
    p.magnetT=Math.max(0,(p.magnetT||0)-dt);
    if(p.dashCharges<p.dashMax){p.dashCd+=dt;if(p.dashCd>=p.dashMaxCd){p.dashCd=0;p.dashCharges++;}}else p.dashCd=0;
  }
  // fire weapons for remote allies
  for(const p of allies){
    if(p.hp<=0||p.left||p.id===myId) continue;
    const prev=player;player=p;try{updateWeapons(dt);}catch(e){}player=prev;
  }
  player=local;
  netSendT+=dt;
  if(netSendT>=0.08){netSendT=0;sendSnap();}
}

function applyUpgradeFor(who,u){
  if(!u||!who) return;
  const prev=player;player=who;

  player=who;
  if(prev&&prev.id===who.id) player=who; else player=prev||who;

}

function wrapNotice(text,maxW,font){
  ctx.font=font;
  const lines=[]; let line='';
  for(let i=0;i<text.length;i++){
    const ch=text[i],t=line+ch;
    if(ctx.measureText(t).width>maxW&&line){
      let k=line.length-1;
      while(k>3&&!/[\s.,!?]/.test(line[k])) k--;
      if(k>3&&k>line.length*0.45){lines.push(line.slice(0,k+1).trimEnd());line=line.slice(k+1)+ch;}
      else{lines.push(line);line=ch;}
    }else line=t;
  }
  if(line) lines.push(line);
  return lines;
}

function drawPortraitAt(x,y,s){

  ctx.fillStyle='#b46bff';ctx.beginPath();ctx.moveTo(-s*0.32,-s*0.28);ctx.lineTo(s*0.32,-s*0.28);ctx.lineTo(s*0.06,-s*0.72);ctx.closePath();ctx.fill();

}

  {t:'equip'},
  {t:'talk',who:'네온 생존자',text:'함 놀아볼까?'},
  {t:'end'}
];

function placeNeonBase(from){
  if(from&&from.x!=null&&from.y!=null){
    neonBase={x:+from.x,y:+from.y,padR:+from.padR||BASE_PAD};
    return;
  }
  if(typeof isNetClient==='function'&&isNetClient()) return;
  neonBase={x:Math.cos(BASE_ANG)*BASE_DIST,y:Math.sin(BASE_ANG)*BASE_DIST,padR:BASE_PAD};
}
function packNeonBase(){return neonBase?{x:neonBase.x,y:neonBase.y,padR:neonBase.padR}:null;}
function baseDistTo(u){return (!neonBase||!u)?1e15:Math.hypot(u.x-neonBase.x,u.y-neonBase.y);}
function nearestBaseUnit(){
  const units=(typeof partyUnits==='function'&&partyUnits().length)?partyUnits():(player?[player]:[]);
  let best=null,bd=1e15;
  for(const u of units){
    if(!u||u.hp<=0||u.left) continue;
    const d=baseDistTo(u);
    if(d<bd){bd=d;best=u;}
  }
  if(!best&&player){best=player;bd=baseDistTo(player);}
  return {u:best,d:bd};
}
function baseMeters(){const d=nearestBaseUnit().d;return Math.max(0,Math.round((isFinite(d)?d:0)/BASE_M));}

function clearCombatFX(){
  if(typeof arrRel==='function'&&typeof poolB!=='undefined'){
    while(bullets.length) arrRel(bullets,0,poolB);
  }else bullets.length=0;
  wprojs.length=0;
  eprojs.length=0;
  zaps.length=0;beams.length=0;
  if(typeof meteors!=='undefined') meteors.length=0;
}

function checkArrive(){
  if(arriveShown||!neonBase) return;
  if(typeof isSimHost==='function'&&!isSimHost()) return;
  const {d}=nearestBaseUnit();
  if(d<=(neonBase.padR||BASE_PAD)) onArriveNeonBase(false);
}

function onArriveNeonBase(fromNet){
  if(arriveShown) return;
  arriveShown=true;
  endJoy();
  clearCombatFX();
  for(const e of enemies) e.frozen=true;
  state='cutscene';cutKind='arrive';cutScene='world';
  cutI=0;cutT=0;cutAuto=-1;cutLock=false;boomCueT=0;camAim={x:null,y:null,k:8};
  startCutBeat();
  if(neonBase) burst(neonBase.x,neonBase.y,'#4df3ff',18,200,0.4);
  beep(480,0.1,'square',0.06,900);
  vibe([12,24,16]);
  if(!fromNet&&typeof isNetHost==='function'&&isNetHost()) bcast({t:'arrive',base:packNeonBase()});
}

function currentCut(){return BASE_CUT[cutI]||null;}

function startCutBeat(){
  const b=currentCut();
  cutT=0;cutAuto=-1;stepAnim=null;
  if(!b){finishCutscene();return;}
  if(b.cam==='both') aimCamBoth();
  if(b.t==='talk'){cutAuto=-1;beep(b.who==='네온 생존자'?620:280,0.05,'triangle',0.04);}
  else if(b.t==='panBoss'){ensureBossFormation();aimCamBoss();cutAuto=0.95;}
  else if(b.t==='step'){beginBossStep();cutAuto=0.62;}
  else if(b.t==='equip'){grantBoomerangAll();boomCueT=1.25;cutAuto=1.15;beep(740,0.12,'square',0.07,1400);}
  else if(b.t==='end'){aimCamPlayer();cutAuto=0.7;}
  cutDebug={beat:b.t,who:b.who||null,text:b.text||null,cam:camAim,boss:!!getSuperElite(),boom:boomGranted};
}

function cutAdvance(fromNet){
  if(state!=='cutscene') return;
  if(!fromNet&&typeof isStoryHost==='function'&&!isStoryHost()) return;
  const b=currentCut();
  if(b&&b.t==='talk'&&cutAuto<0){ /* ok */ }
  else if(b&&cutAuto>0) return;
  cutI++;
  if(cutI>=BASE_CUT.length){finishCutscene();return;}
  startCutBeat();
  if(!fromNet&&typeof isNetHost==='function'&&isNetHost()) bcast({t:'cut',i:cutI});
}

function skipCutscene(fromNet){
  if(state!=='cutscene') return;
  if(!fromNet&&typeof isStoryHost==='function'&&!isStoryHost()) return;
  ensureBossFormation();
  grantBoomerangAll();
  if(!fromNet&&typeof isNetHost==='function'&&isNetHost()) bcast({t:'cutskip'});
  finishCutscene();
}

function applyCutIndex(i){
  if(state!=='cutscene'){if(!arriveShown) onArriveNeonBase(true);else state='cutscene';}
  cutI=Math.max(0,i|0);
  startCutBeat();
}

function finishCutscene(){
  if(state!=='cutscene') return;
  ensureBossFormation();
  grantBoomerangAll();
  for(const e of enemies) e.frozen=false;
  camAim={x:null,y:null,k:6};
  state='play';
  last=performance.now();
  grace=Math.max(grace,0.45);
  cutDebug={beat:'fight',who:null,text:null,cam:null,boss:!!getSuperElite(),boom:boomGranted};
  beep(520,0.1,'square',0.06,1100);
}

function aimCamBoss(){
  const b=getSuperElite();
  if(b) camAim={x:b.x,y:b.y,k:3.1};
}
function aimCamBoth(){
  const b=getSuperElite();
  if(b&&player) camAim={x:(player.x+b.x)*0.5,y:(player.y+b.y)*0.5,k:3.2};
}
function aimCamPlayer(){
  if(player) camAim={x:player.x,y:player.y,k:3.4};
}
function tickCam(dt){
  const tx=camAim.x!=null?camAim.x:(player?player.x:cam.x);
  const ty=camAim.y!=null?camAim.y:(player?player.y:cam.y);
  const k=camAim.k||8;
  cam.x+=(tx-cam.x)*Math.min(1,dt*k);
  cam.y+=(ty-cam.y)*Math.min(1,dt*k);
}

function beginBossStep(){
  const b=getSuperElite();
  if(!b||!player) return;
  const n=norm(player.x-b.x,player.y-b.y);
  const dist=56;
  const movers=enemies.filter(e=>e.boss||e.minion);
  stepAnim={t:0,dur:0.42,items:movers.map(e=>({e,x0:e.x,y0:e.y,x1:e.x+n.x*dist,y1:e.y+n.y*dist}))};
  shake=Math.max(shake,14);
  beep(90,0.18,'sawtooth',0.08,40);
  vibe([30,20,40]);
}

function tickStepAnim(dt){
  if(!stepAnim) return;
  stepAnim.t+=dt;
  const k=Math.min(1,stepAnim.t/stepAnim.dur);
  const e=k*k*(3-2*k);
  for(const it of stepAnim.items){it.e.x=it.x0+(it.x1-it.x0)*e;it.e.y=it.y0+(it.y1-it.y0)*e;}
  if(k>=1) stepAnim=null;
}

function tickCutscene(dt){
  shake=Math.max(0,shake-dt*28);
  boomCueT=Math.max(0,boomCueT-dt);
  tickCam(dt);
  tickStepAnim(dt);
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.92;p.vy*=0.92;p.life-=dt;
    if(p.life<=0) arrRel(particles,i,poolP);
  }
  if(typeof isStoryHost==='function'&&isStoryHost()&&cutAuto>=0){
    cutAuto-=dt;
    if(cutAuto<=0){cutAuto=-1;cutAdvance(false);}
  }
  if(typeof isNetHost==='function'&&isNetHost()){
    netSendT+=dt;
    if(netSendT>=0.1){netSendT=0;sendSnap();}
  }
}

function grantBoomerangTo(p){
  if(!p||!p.wep) return;
  if(p.wep.boom){if(p.wep.boom<MAXLV) p.wep.boom++;}
  else{
    p.wep.boom=1;
    if(p.wepCd) p.wepCd.boom=0.2;
  }
}
function grantBoomerangAll(){
  if(boomGranted) return;
  boomGranted=true;
  const units=(allies&&allies.length)?allies:(player?[player]:[]);
  const seen=new Set();
  for(const p of units){ if(p&&!seen.has(p)){seen.add(p);grantBoomerangTo(p);} }
  if(player&&!seen.has(player)) grantBoomerangTo(player);
  boomCueT=Math.max(boomCueT,1.15);
}

function getSuperElite(){return enemies.find(e=>e&&e.boss&&e.hp>0)||null;}

function spawnMinionAt(kind,x,y,frozen){
  let e;
  if(kind==='runner') e={x,y,r:11,hp:9,spd:175,dmg:7,xp:1,col:'#ffd84d',kind,hit:0};
  else if(kind==='tank') e={x,y,r:22,hp:62,spd:68,dmg:16,xp:3,col:'#b46bff',kind,hit:0};
  else e={x,y,r:14,hp:14,spd:108,dmg:10,xp:1,col:'#ff4d6d',kind:'grunt',hit:0};
  e.max=e.hp;e.minion=true;e.frozen=!!frozen;e.orbCd=0;
  enemies.push(e);
  return e;
}

function ensureBossFormation(){
  let boss=enemies.find(e=>e&&e.boss);
  if(boss) return boss;
  if(!neonBase) placeNeonBase();
  const dir=neonBase?norm(neonBase.x,neonBase.y):{x:Math.cos(BASE_ANG),y:Math.sin(BASE_ANG)};
  const px=-dir.y,py=dir.x;
  const n=Math.max(1,(typeof partyUnits==='function'&&partyUnits().length)?partyUnits().length:1);
  const hp=Math.round(SEB_HP*(1+0.4*(n-1)));
  const bx=(neonBase?neonBase.x:0)+dir.x*260;
  const by=(neonBase?neonBase.y:0)+dir.y*260;
  // drop leftover journey enemies so the flanking formation reads clearly
  for(let i=enemies.length-1;i>=0;i--){
    if(!enemies[i].boss&&!enemies[i].minion) enemies.splice(i,1);
  }
  boss={
    x:bx,y:by,r:SEB_R,hp,max:hp,spd:SEB_SPD,dmg:18,xp:28,
    col:'#ffcf40',kind:'seb',hit:0,elite:true,boss:true,frozen:state==='cutscene',
    atk:'idle',atkT:2.4,shotCd:3.2,callCd:6.8,
    dashVx:0,dashVy:0,warnX:bx,warnY:by,warnT:0,orbCd:0
  };
  enemies.push(boss);
  const offs=[-126,-66,66,126,0];
  const back=[-26,-14,-14,-26,-54];
  const kinds=['grunt','runner','grunt','runner','tank'];
  for(let i=0;i<offs.length;i++){
    spawnMinionAt(kinds[i], bx+px*offs[i]+dir.x*back[i], by+py*offs[i]+dir.y*back[i], state==='cutscene');
  }
  return boss;
}

function updateSuperElite(e,dt){
  e.hit=Math.max(0,e.hit-dt);
  if(e.frozen) return;
  const tgt=nearestAlly(e.x,e.y);
  if(!tgt) return;
  if(e.atk==='warn'){
    const n=norm(tgt.x-e.x,tgt.y-e.y);
    e.warnX=e.x+n.x*440;e.warnY=e.y+n.y*440;
    e.dashVx=n.x;e.dashVy=n.y;
    e.warnT-=dt;
    if(e.warnT<=0){
      e.atk='charge';e.atkT=0.26;
      beep(160,0.1,'sawtooth',0.06,80);
    }
    return;
  }
  if(e.atk==='charge'){
    const sp=820;
    e.x+=e.dashVx*sp*dt;e.y+=e.dashVy*sp*dt;
    e.atkT-=dt;
    let hitP=null;
    for(const u of partyUnits()){
      const pr=e.r+u.r+2,dx=e.x-u.x,dy=e.y-u.y;
      if(dx*dx+dy*dy<pr*pr){hitP=u;break;}
    }
    if(hitP) hurtPlayer(26,e.x,e.y,hitP);
    if(e.atkT<=0){e.atk='idle';e.atkT=rand(1.6,2.6);}
    return;
  }
  const n=norm(tgt.x-e.x,tgt.y-e.y);
  e.x+=n.x*e.spd*dt;e.y+=n.y*e.spd*dt;
  let hitP=null;
  for(const u of partyUnits()){
    const pr=e.r+u.r-2,dx=e.x-u.x,dy=e.y-u.y;
    if(dx*dx+dy*dy<pr*pr){hitP=u;break;}
  }
  if(hitP) hurtPlayer(e.dmg,e.x,e.y,hitP);
  e.atkT-=dt;e.shotCd-=dt;e.callCd-=dt;
  if(e.shotCd<=0){bossRadial(e);e.shotCd=5.5;}
  else if(e.callCd<=0){bossCallMinions(e);e.callCd=8.4;}
  else if(e.atkT<=0){e.atk='warn';e.warnT=0.72;}
}

function bossRadial(e){
  const n=12,spd=250;
  const off=titleT*0.7;
  for(let i=0;i<n;i++){
    const a=i/n*TAU+off;
    eprojs.push({x:e.x,y:e.y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,r:7,life:2.15,dmg:12,col:'#ff5a4d'});
  }
  ring(e.x,e.y,'#ff5a4d',90,0.35);
  beep(420,0.08,'square',0.05,200);
}

function bossCallMinions(e){
  let n=0;for(const x of enemies) if(x.minion&&x.hp>0) n++;
  const want=Math.min(4,10-n);
  if(want<=0||enemies.length>=70) return;
  for(let i=0;i<want;i++){
    const a=rand(0,TAU),d=150+rand(0,90);
    const kind=Math.random()<0.28?'runner':'grunt';
    spawnMinionAt(kind,e.x+Math.cos(a)*d,e.y+Math.sin(a)*d,false);
  }
  ring(e.x,e.y,'#ffcf40',120,0.4);
  beep(200,0.1,'triangle',0.05,90);
}

function updateEprojs(dt){
  for(let i=eprojs.length-1;i>=0;i--){
    const p=eprojs[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    if(p.life<=0){eprojs.splice(i,1);continue;}
    let hit=false;
    for(const u of partyUnits()){
      const rr=p.r+u.r-2,dx=p.x-u.x,dy=p.y-u.y;
      if(dx*dx+dy*dy<rr*rr){hurtPlayer(p.dmg,p.x,p.y,u);hit=true;break;}
    }
    if(hit) eprojs.splice(i,1);
  }
}

function onDefeatSuperEliteBoss(fromNet){

  bossDefeated=true;

function victoryToTitle(){backToTitle();}

function drawSuperElite(e){
  const s=wrld(e.x,e.y),S=scale,R=e.r*S;
  const pulse=0.5+0.5*Math.sin(titleT*4.2);
  const flash=e.hit>0;
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  ctx.strokeStyle='rgba(255,80,60,'+(0.28+0.22*pulse)+')';
  ctx.lineWidth=Math.max(2,3*S);
  ctx.beginPath();ctx.arc(s.x,s.y,R*(1.28+0.08*pulse),0,TAU);ctx.stroke();
  ctx.strokeStyle='rgba(255,207,64,'+(0.22+0.18*pulse)+')';
  ctx.beginPath();ctx.arc(s.x,s.y,R*(1.48+0.1*pulse),0,TAU);ctx.stroke();
  ctx.restore();
  ctx.save();
  ctx.translate(s.x,s.y);
  const col=flash?'#ffffff':'#ff3b3b';
  ctx.fillStyle=flash?'#fff':n1Shade('#8a1218',0.85);
  ctx.strokeStyle=flash?'#fff':'#ffcf40';
  ctx.lineWidth=Math.max(2.4,3*S);
  ctx.beginPath();
  for(let i=0;i<8;i++){
    const a=i/8*TAU+TAU/16,x=Math.cos(a)*R,y=Math.sin(a)*R;
    i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  }
  ctx.closePath();ctx.fill();ctx.stroke();
  if(!flash){
    ctx.fillStyle='#3a0a0c';
    ctx.beginPath();
    for(let i=0;i<8;i++){
      const a=i/8*TAU+TAU/16,x=Math.cos(a)*R*0.62,y=Math.sin(a)*R*0.62;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff3c8';
    ctx.beginPath();ctx.arc(-R*0.32,-R*0.08,R*0.16,0,TAU);ctx.arc(R*0.32,-R*0.08,R*0.16,0,TAU);ctx.fill();
    ctx.fillStyle='#7a0008';
    ctx.beginPath();ctx.arc(-R*0.32,-R*0.06,R*0.07,0,TAU);ctx.arc(R*0.32,-R*0.06,R*0.07,0,TAU);ctx.fill();
    // ornate crown
    ctx.fillStyle='#ffcf40';
    ctx.beginPath();
    ctx.moveTo(-R*0.62,-R*0.42);
    ctx.lineTo(-R*0.62,-R*0.92);
    ctx.lineTo(-R*0.36,-R*0.68);
    ctx.lineTo(-R*0.16,-R*1.08);
    ctx.lineTo(0,-R*0.72);
    ctx.lineTo(R*0.16,-R*1.08);
    ctx.lineTo(R*0.36,-R*0.68);
    ctx.lineTo(R*0.62,-R*0.92);
    ctx.lineTo(R*0.62,-R*0.42);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle='#fff3c0';ctx.lineWidth=Math.max(1.2,1.5*S);
    ctx.stroke();
    ctx.fillStyle='#ff5a4d';
    ctx.beginPath();ctx.arc(0,-R*1.08,R*0.08,0,TAU);ctx.fill();
    ctx.fillStyle='#ffe07a';
    ctx.beginPath();ctx.arc(-R*0.62,-R*0.92,R*0.06,0,TAU);ctx.arc(R*0.62,-R*0.92,R*0.06,0,TAU);ctx.fill();
  }
  ctx.restore();
  if(e.atk==='warn'&&e.warnT>0){
    const a=wrld(e.x,e.y),b=wrld(e.warnX,e.warnY);
    ctx.save();
    ctx.strokeStyle='rgba(255,50,50,'+(0.45+0.35*Math.sin(titleT*22))+')';
    ctx.lineWidth=Math.max(3,4*S);
    ctx.setLineDash([10,7]);ctx.lineDashOffset=-titleT*40;
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='rgba(255,40,40,0.55)';
    const ang=Math.atan2(b.y-a.y,b.x-a.x);
    ctx.beginPath();
    ctx.moveTo(b.x,b.y);
    ctx.lineTo(b.x-Math.cos(ang-0.5)*14,b.y-Math.sin(ang-0.5)*14);
    ctx.lineTo(b.x-Math.cos(ang+0.5)*14,b.y-Math.sin(ang+0.5)*14);
    ctx.closePath();ctx.fill();
    ctx.restore();
  }
}

    const tw=ctx.measureText(label).width+22,th=Math.max(26,28*u);

  ctx.strokeStyle='rgba(77,243,255,0.85)';ctx.lineWidth=Math.max(2,2.4*S);
  ctx.beginPath();ctx.arc(c.x,c.y,R,0,TAU);ctx.stroke();

function navForbidden(){
  const list=[{x:uiPause.x,y:uiPause.y,r:uiPause.r+26}];
  if(isTouchUI()){
    list.push({x:uiDash.x,y:uiDash.y,r:uiDash.r+26});
    for(const s of uiSkills) list.push({x:s.x,y:s.y,r:s.r+20});
    const ins=getInsets();
    const jr=Math.max(52,Math.min(W,H)*0.13);
    list.push({x:ins.l+jr+22,y:H-ins.b-jr-18,r:jr+26});
  }
  return list;
}
function navSafeRect(extra){
  const ins=getInsets();
  const pad=14;
  let l=ins.l+pad, r=W-ins.r-pad;
  let t=Math.max(ins.t+14+78, uiPause.y+uiPause.r+16);
  let b=H-ins.b-pad-8;
  if(isTouchUI()){
    b=Math.min(b, uiDash.y-uiDash.r-24);
    const jr=Math.max(52,Math.min(W,H)*0.13);
    b=Math.min(b, H-ins.b-jr-18-jr-24);
  }
  if(extra&&extra.t!=null) t=Math.max(t,extra.t);
  if(navDebug.bossBar) t=Math.max(t, navDebug.bossBar.y+navDebug.bossBar.h+10);
  if(t>b-36){const mid=(t+b)/2;t=mid-18;b=mid+18;}
  return {l,t,r,b};
}
function pushOutOfUI(x,y,rect,forbid){
  x=clamp(x,rect.l,rect.r);y=clamp(y,rect.t,rect.b);
  for(let k=0;k<5;k++){
    for(const f of forbid){
      const dx=x-f.x,dy=y-f.y,d=Math.hypot(dx,dy);
      if(d<f.r){
        const nx=d<0.01?0:dx/d, ny=d<0.01?-1:dy/d;
        x=f.x+nx*f.r;y=f.y+ny*f.r;
        x=clamp(x,rect.l,rect.r);y=clamp(y,rect.t,rect.b);
      }
    }
  }
  return {x,y};
}
function rayBoxExit(ox,oy,dx,dy,rect){
  let t=Infinity;
  if(dx>1e-6) t=Math.min(t,(rect.r-ox)/dx);
  else if(dx<-1e-6) t=Math.min(t,(rect.l-ox)/dx);
  if(dy>1e-6) t=Math.min(t,(rect.b-oy)/dy);
  else if(dy<-1e-6) t=Math.min(t,(rect.t-oy)/dy);
  if(!isFinite(t)||t<0) return {x:clamp(ox,rect.l,rect.r),y:clamp(oy,rect.t,rect.b)};
  return {x:ox+dx*t,y:oy+dy*t};
}

function drawBaseNav(){
  navDebug={badge:null,arrow:null,label:null,safe:null,bossBar:navDebug.bossBar};
  const dest=(typeof navDest==="function")?navDest():null;
  const destBase=dest?dest.base:neonBase;
  if(!destBase||(state!=='play'&&state!=='pause')) return;
  if(dest&&dest.hide) return;
  if(!dest&&arriveShown) return;
  const m=dest?dest.meters:(typeof baseMeters==="function"?baseMeters():0);
  const badge=(dest?dest.label:'네온 기지로 이동')+'  ·  '+m+'m';
  const ins=getInsets();
  const u=clamp(Math.min(W,H)/390,0.8,1.35);
  const xpY=ins.t,xpH=14,hy=xpY+xpH+10,hh=18;
  ctx.save();
  ctx.font='800 '+Math.max(11,Math.round(13*u))+'px '+FONT;
  ctx.textAlign='center';ctx.textBaseline='middle';
  const tw=ctx.measureText(badge).width;
  const bw=Math.min(W-ins.l-ins.r-24, tw+22), bh=Math.max(20,22*u);
  const bx=W/2-bw/2;
  const by=hy+hh+6;
  ctx.fillStyle='rgba(10,12,36,0.78)';
  rounded(bx,by,bw,bh,bh/2);ctx.fill();
  ctx.strokeStyle='rgba(77,243,255,0.7)';ctx.lineWidth=1.4;
  rounded(bx,by,bw,bh,bh/2);ctx.stroke();
  ctx.fillStyle='#e8fbff';
  ctx.shadowColor='#4df3ff';ctx.shadowBlur=8;
  ctx.fillText(badge,W/2,by+bh/2+0.5);
  ctx.shadowBlur=0;
  ctx.restore();
  navDebug.badge={x:bx,y:by,w:bw,h:bh};

  const sc=wrld(destBase.x,destBase.y);
  const margin=28;
  const onScreen=sc.x>=margin&&sc.x<=W-margin&&sc.y>=margin&&sc.y<=H-margin;
  const forbid=navForbidden();
  const safe=navSafeRect({t:by+bh+14});
  navDebug.safe=safe;
  if(onScreen||arriveShown) return;

  const exit=rayBoxExit(W/2,H/2,sc.x-W/2,sc.y-H/2,safe);
  const pos=pushOutOfUI(exit.x,exit.y,safe,forbid);
  const ang=Math.atan2(sc.y-pos.y,sc.x-pos.x);
  const sz=Math.max(14,16*u);
  ctx.save();
  ctx.translate(pos.x,pos.y);ctx.rotate(ang);
  ctx.shadowColor='#4df3ff';ctx.shadowBlur=14;
  ctx.fillStyle='#4df3ff';
  ctx.beginPath();
  ctx.moveTo(sz,0);
  ctx.lineTo(-sz*0.72,-sz*0.72);
  ctx.lineTo(-sz*0.22,0);
  ctx.lineTo(-sz*0.72,sz*0.72);
  ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(243,254,255,0.85)';ctx.lineWidth=1.2;
  ctx.stroke();
  ctx.restore();
  navDebug.arrow={x:pos.x,y:pos.y,r:sz+6,ang};

  const lab=(dest?dest.short:'네온 기지')+' '+m+'m';
  ctx.save();
  ctx.font='800 '+Math.max(11,Math.round(13*u))+'px '+FONT;
  ctx.textAlign='center';ctx.textBaseline='middle';
  const lw=ctx.measureText(lab).width+16, lh=Math.max(18,20*u);
  const inward=norm(W/2-pos.x,H/2-pos.y);
  let lx=pos.x+inward.x*(sz+lh*0.2+lw*0.15);
  let ly=pos.y+inward.y*(sz+lh+4);
  if(Math.abs(inward.x)<0.35) lx=pos.x;
  const labRect={x:lx-lw/2,y:ly-lh/2,w:lw,h:lh};
  labRect.x=clamp(labRect.x,safe.l,safe.r-labRect.w);
  labRect.y=clamp(labRect.y,safe.t,safe.b-labRect.h);
  const mid=pushOutOfUI(labRect.x+labRect.w/2,labRect.y+labRect.h/2,safe,forbid);
  labRect.x=clamp(mid.x-labRect.w/2,safe.l,safe.r-labRect.w);
  labRect.y=clamp(mid.y-labRect.h/2,safe.t,safe.b-labRect.h);
  ctx.fillStyle='rgba(10,12,36,0.82)';
  rounded(labRect.x,labRect.y,labRect.w,labRect.h,labRect.h/2);ctx.fill();
  ctx.strokeStyle='rgba(180,107,255,0.7)';ctx.lineWidth=1.2;
  rounded(labRect.x,labRect.y,labRect.w,labRect.h,labRect.h/2);ctx.stroke();
  ctx.fillStyle='#f3feff';
  ctx.shadowColor='#4df3ff';ctx.shadowBlur=8;
  ctx.fillText(lab,labRect.x+labRect.w/2,labRect.y+labRect.h/2+0.5);
  ctx.shadowBlur=0;
  ctx.restore();
  navDebug.label=labRect;
}

function densestCluster(){
  const C=220,m=new Map();let best=null,bn=0;
  for(const e of enemies){
    if(!e||e.hp<=0) continue;
    const k=(e.x/C|0)+','+(e.y/C|0);
    let o=m.get(k);if(!o){o={n:0,sx:0,sy:0};m.set(k,o);}
    o.n++;o.sx+=e.x;o.sy+=e.y;if(o.n>bn){bn=o.n;best=o;}
  }
  return best?{x:best.sx/best.n,y:best.sy/best.n}:null;
}

function tickSdash(P,dt){

      p.px=w.x;p.py=w.y;mv-=l;p.wp.shift();
      rings.push({x:p.px,y:p.py,r:0,max:110,t:0,dur:0.25,c:'#fff27a'});

        p.hops--;

        if(c.length){const e=c[(Math.random()*c.length)|0];p.wp.push({x:e.x,y:e.y});}
      }
    }else{p.px+=dx/l*mv;p.py+=dy/l*mv;mv=0;}
  }
  P.x=p.x=p.px;P.y=p.y=p.py;
  P.facing=Math.atan2((p.wp[0]?p.wp[0].y:p.oy)-P.y,(p.wp[0]?p.wp[0].x:p.ox)-P.x)||P.facing;
  if(afterimages.length<80) afterimages.push({x:P.x,y:P.y,ang:P.facing,life:0.22,skin:'speed'});
  if(!p.ch) p.ch=new Set();
  for(const e of nearestN(P.x,P.y,50,P.r+60)){
    if(e.hp<=0) continue;
    const first=!p.ch.has(e);p.ch.add(e);
    if(isHeavy(e)){if(first){hurtEnemy(e,null,p.D*8,0,0);burst(e.x,e.y,'#fff27a',10,240,0.35,3);dashImpact(e,p);}continue;}
    hurtEnemy(e,null,Math.max(e.hp+1,e.max||e.hp),0,0);
    burst(e.x,e.y,'#fff27a',6,200,0.3,3);
    if(first) dashImpact(e,p);
  }
  p.zt-=dt;
  if(p.zt<=0){
    p.zt=0.05;
    const t1=nearestN(P.x,P.y,10,280).slice();
    for(let i=0;i<3&&t1.length;i++){
      const e=t1.splice((Math.random()*t1.length)|0,1)[0];

      zaps.push({pts:[{x:P.x,y:P.y},{x:(P.x+e.x)/2+(Math.random()*40-20),y:(P.y+e.y)/2+(Math.random()*40-20)},{x:e.x,y:e.y}],t:0.18});
      hurtEnemy(e,null,p.D*2,e.x-P.x,40);
      for(const f of nearestN(e.x,e.y,4,200)){
        if(f===e||f.hp<=0) continue;
        zaps.push({pts:[{x:e.x,y:e.y},{x:(e.x+f.x)/2+(Math.random()*30-15),y:(e.y+f.y)/2+(Math.random()*30-15)},{x:f.x,y:f.y}],t:0.15});
        hurtEnemy(f,null,p.D*1.6,f.x-e.x,30);
      }
    }
  }
  if(!p.wp.length&&!p.ret&&p.life>0){
    p.ret=1;p.hops=0;p.wp.push({x:p.ox,y:p.oy});
    rings.push({x:P.x,y:P.y,r:0,max:240,t:0,dur:0.4,c:'#fff27a'});

  if(!p.wp.length||p.life<=0){
    p.life=0;P.sdash=null;
    rings.push({x:P.x,y:P.y,r:0,max:240,t:0,dur:0.4,c:'#fff27a'});
    rings.push({x:P.x,y:P.y,r:0,max:140,t:0,dur:0.3,c:'#ffffff'});
    burst(P.x,P.y,'#fff27a',40,520,0.5,4);
    P.iframe=Math.max(P.iframe||0,0.6);
  }
}

function applySwap(d){
  const id=d&&d.id, units=(allies&&allies.length)?allies:[player];
  const P=units.find(u=>u&&u.id===id)||player;
  if(P) swapWithBuddy(P,d);
}

function swapWithBuddy(P){
  if(!P) return;
  ensureBuddy(P);
  const b=P.buddy;if(!b) return;
  const sx=P.x,sy=P.y;
  P.x=b.x;P.y=b.y;b.x=sx;b.y=sy;
  P.skin=(P.skin==='speed')?'hero':'speed';
  b.skin=(P.skin==='speed')?'hero':'speed';
  burst(P.x,P.y,'#39ff88',18,220,0.35,3);
  burst(b.x,b.y,'#4df3ff',14,200,0.3,3);
  ring(P.x,P.y,'#39ff88',80);
}

function ensureBuddy(P){
  if(!P) return null;
  if(P.buddy) return P.buddy;
  const skin=(P.skin==='speed')?'hero':'speed';
  const ang=(P.facing||0)+2.4;
  P.buddy={x:P.x+Math.cos(ang)*52,y:P.y+Math.sin(ang)*52,r:14,facing:P.facing||0,skin,t:0};
  return P.buddy;
}
function applyBuddySnap(P,s){
  if(!P||!s) return;
  const b=ensureBuddy(P);
  b.x=s.x;b.y=s.y;if(s.facing!=null)b.facing=s.facing;if(s.skin)b.skin=s.skin;
}

function tickBuddies(dt){
  const units=(allies&&allies.length)?allies:(player?[player]:[]);
  for(const P of units){
    if(!P||!speedJoined) continue;
    const b=ensureBuddy(P);
    b.t=(b.t||0)+dt;
    const ang=(P.facing||0)+2.5;
    const tx=P.x+Math.cos(ang)*52, ty=P.y+Math.sin(ang)*52;
    b.x+=(tx-b.x)*Math.min(1,6*dt);
    b.y+=(ty-b.y)*Math.min(1,6*dt);
    b.facing=P.facing||b.facing;
    if(b.skin==='speed'&&afterimages.length<90){
      const dx=tx-b.x,dy=ty-b.y;
      if(dx*dx+dy*dy>8) afterimages.push({x:b.x,y:b.y,ang:b.facing,life:0.18,skin:'speed'});
    }
  }
}

function drawBuddies(){
  if(!speedJoined) return;
  const units=(allies&&allies.length)?allies:(player?[player]:[]);
  const seen=new Set();
  for(const P of units){
    if(!P||!P.buddy||seen.has(P.buddy)) continue;
    seen.add(P.buddy);
    const b=P.buddy,s=wrld(b.x,b.y);
    n1Player(s.x,s.y,1,false,Math.sin((b.t||0)*8)*1.5*scale,Math.cos(b.facing||0),Math.sin(b.facing||0),false,b.skin);
  }
}

function dropMagnet(e){
  if(!e||isNetClient()) return;
  magDropT=Math.max(0,magDropT);
  if(magDropT>0) return;
  const n=(pickups||[]).filter(p=>p.k==='magnet').length;
  if(n>=3) return;
  let chance=0.008;
  if(e.elite) chance=0.08;
  if(e.boss||e.kind==='seb'||e.kind==='ns1boss') chance=0.4;
  if(Math.random()>chance) return;
  pickups.push({k:'magnet',x:e.x,y:e.y,life:14,t:0});
  magDropT=6;
}

function tickPickups(dt){
  magDropT=Math.max(0,magDropT-dt);
  for(let i=pickups.length-1;i>=0;i--){
    const p=pickups[i];p.t=(p.t||0)+dt;p.life-=dt;
    if(p.life<=0){pickups.splice(i,1);continue;}
    const units=(allies&&allies.length)?allies:(player?[player]:[]);
    let got=null;
    for(const u of units){
      if(!u||u.hp<=0) continue;
      if((u.x-p.x)*(u.x-p.x)+(u.y-p.y)*(u.y-p.y)<(u.r+18)*(u.r+18)){got=u;break;}
    }
    if(got){
      pickups.splice(i,1);
      for(const g of gems) g.mag=true;
      ring(got.x,got.y,'#7cff6b',110);
      burst(got.x,got.y,'#7cff6b',14,180,0.3,3);
      beep(880,0.1,'sine',0.06,1400);
    }
  }
}
function packPickups(){return (pickups||[]).map(p=>({k:p.k,x:p.x,y:p.y,life:p.life,t:p.t}));}
function applyPickupsSnap(arr){pickups=(arr||[]).map(s=>({k:s.k||'magnet',x:s.x,y:s.y,life:s.life,t:s.t||0}));}

  const hp=Math.round((hard?NS1BOSS_HARD_HP:NS1BOSS_HP)*sc);

  const dmg=hard?Math.round(26*1.45):26;
