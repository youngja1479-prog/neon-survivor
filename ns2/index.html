<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>네온 생존자 2 v6</title>
<style>
  :root{
    --sat:env(safe-area-inset-top,0px);
    --sar:env(safe-area-inset-right,0px);
    --sab:env(safe-area-inset-bottom,0px);
    --sal:env(safe-area-inset-left,0px);
  }
  html,body{
    margin:0;padding:0;
    width:100%;height:100%;
    width:100dvw;height:100dvh;
    overflow:hidden;
    background:#05060d;
    touch-action:none;
    overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
  }
  canvas{
    display:block;
    width:100%;height:100%;
    touch-action:none;
    -webkit-user-select:none;
  }
  *{
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d",{alpha:false});
let W=0,H=0,DPR=1,scale=1;
function viewportSize(){
  const vv=window.visualViewport;
  if(vv&&vv.width&&vv.height) return {w:Math.round(vv.width),h:Math.round(vv.height),x:vv.offsetLeft||0,y:vv.offsetTop||0};
  return {w:window.innerWidth,h:window.innerHeight,x:0,y:0};
}
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  const v=viewportSize();
  W=Math.max(1,v.w);H=Math.max(1,v.h);
  canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);
  canvas.style.width=W+"px";canvas.style.height=H+"px";
  canvas.style.position="fixed";
  canvas.style.left=v.x+"px";
  canvas.style.top=v.y+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  scale=Math.min(1,W/760,H/520);
  layoutUI();
  if(typeof joy!=="undefined"&&joy.active) endJoy();
}
window.addEventListener("resize",resize);
window.addEventListener("orientationchange",()=>setTimeout(resize,80));
if(window.visualViewport){
  visualViewport.addEventListener("resize",resize);
  visualViewport.addEventListener("scroll",resize);
}

const FONT="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif";
const rand=(a,b)=>a+Math.random()*(b-a);
const randi=(a,b)=>Math.floor(rand(a,b+1));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function norm(x,y){const l=Math.hypot(x,y);return l<1e-6?{x:0,y:0}:{x:x/l,y:y/l};}
function getInsets(){
  const cs=getComputedStyle(document.documentElement);
  const n=v=>Math.max(0,parseFloat(cs.getPropertyValue(v))||0);
  return {t:n("--sat"),r:n("--sar"),b:n("--sab"),l:n("--sal")};
}

let actx=null;
function ensureAudio(){
  if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
  if(actx.state==="suspended") actx.resume();
}
function beep(freq,dur,type,vol,slide){
  if(!actx) return;
  try{
    const t=actx.currentTime;
    const o=actx.createOscillator();
    const g=actx.createGain();
    o.type=type||"square";
    o.frequency.setValueAtTime(freq,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+dur);
    g.gain.setValueAtTime(vol||0.05,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g);g.connect(actx.destination);
    o.start(t);o.stop(t+dur+0.02);
  }catch(err){}
}
function vibe(pat){
  try{ if(navigator.vibrate) navigator.vibrate(pat); }catch(err){}
}
let fsTried=false;
function tryFullscreen(){
  if(fsTried) return;
  fsTried=true;
  const el=document.documentElement;
  const req=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen;
  if(!req) return;
  Promise.resolve(req.call(el)).catch(()=>{});
}

const keys=Object.create(null);
const mouse={x:0,y:0};
let usedTouch=false,lastTouchAt=-1e9,dashHeld=false,dashTouchId=null;
let joy={active:false,id:null,cx:0,cy:0,x:0,y:0,dx:0,dy:0,r:64};
let uiPause={x:0,y:0,r:22},uiDash={x:0,y:0,r:48},uiResume={x:0,y:0,w:0,h:0};
let uiSkills=[];
const SKILLS=[
  {id:"shock",name:"충격파",short:"충격",key:"Q",code:"KeyQ",col:"#ff5ea8",cd:6.5},
  {id:"shield",name:"보호막",short:"보호",key:"E",code:"KeyE",col:"#5ee7ff",cd:8},
  {id:"magnet",name:"자석",short:"자석",key:"R",code:"KeyR",col:"#7cff6b",cd:7}
];
let skillHeld=Object.create(null);


function isTouchUI(){
  return usedTouch||("ontouchstart" in window&&matchMedia("(pointer:coarse)").matches);
}
function layoutUI(){
  const ins=getInsets();
  const short=Math.min(W,H);
  const u=clamp(short/390,0.8,1.4);
  const pad=Math.max(10,10*u);
  const pauseR=Math.max(20,22*u);
  uiPause={x:W-ins.r-pad-pauseR,y:ins.t+pad+pauseR+2,r:pauseR};
  const dashR=Math.max(42,Math.min(58,short*0.12));
  uiDash={x:W-ins.r-pad-dashR-2,y:H-ins.b-pad-dashR-6,r:dashR};
  const skillR=Math.max(22,Math.min(32,dashR*0.58));
  const dist=dashR+skillR+14;
  const angs=[-Math.PI*0.50,-Math.PI*0.74,-Math.PI*0.97];
  uiSkills=SKILLS.map((s,i)=>{
    const a=angs[i];
    let x=uiDash.x+Math.cos(a)*dist;
    let y=uiDash.y+Math.sin(a)*dist;
    x=clamp(Math.min(x,uiDash.x),ins.l+skillR+6,W-ins.r-skillR-6);
    y=clamp(Math.min(y,uiDash.y),ins.t+skillR+6,H-ins.b-skillR-6);
    return {id:s.id,x,y,r:skillR,col:s.col,short:s.short,key:s.key,name:s.name,cd:s.cd};
  });
  const rw=Math.min(280,W*0.72),rh=Math.max(52,56*u);
  uiResume={x:W/2-rw/2,y:H*0.54,w:rw,h:rh};
}
function hitCirc(x,y,c,extra){return Math.hypot(x-c.x,y-c.y)<=c.r+(extra||0);}
function hitRect(x,y,r){return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;}

resize();

window.addEventListener("keydown",e=>{
  keys[e.code]=true;
  if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code)) e.preventDefault();
  onKey(e.code);
});
window.addEventListener("keyup",e=>{
  keys[e.code]=false;
  if(e.code==="Space"||e.code.startsWith("Shift")) dashHeld=false;
  if(e.code==="KeyQ") skillHeld.shock=false;
  if(e.code==="KeyE") skillHeld.shield=false;
  if(e.code==="KeyR") skillHeld.magnet=false;
});
window.addEventListener("mousemove",e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
window.addEventListener("mousedown",e=>{
  if(performance.now()-lastTouchAt<700) return;
  ensureAudio();
  onPointer(e.clientX,e.clientY,false);
});
window.addEventListener("mouseup",()=>{dashHeld=false;});
window.addEventListener("contextmenu",e=>e.preventDefault());
function bindTouch(el){
  el.addEventListener("touchstart",onTouchStart,{passive:false});
  el.addEventListener("touchmove",onTouchMove,{passive:false});
  el.addEventListener("touchend",onTouchEnd,{passive:false});
  el.addEventListener("touchcancel",onTouchEnd,{passive:false});
}
bindTouch(window);
window.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});

function onTouchStart(e){
  e.preventDefault();
  lastTouchAt=performance.now();
  usedTouch=true;
  ensureAudio();
  tryFullscreen();
  for(let i=0;i<e.changedTouches.length;i++){
    const t=e.changedTouches[i];
    onPointer(t.clientX,t.clientY,true,t.identifier);
  }
}
function onTouchMove(e){
  e.preventDefault();
  for(let i=0;i<e.changedTouches.length;i++){
    const t=e.changedTouches[i];
    if(joy.active&&t.identifier===joy.id) moveJoy(t.clientX,t.clientY);
  }
}
function onTouchEnd(e){
  e.preventDefault();
  lastTouchAt=performance.now();
  for(let i=0;i<e.changedTouches.length;i++){
    const t=e.changedTouches[i];
    if(joy.active&&t.identifier===joy.id) endJoy();
    if(dashTouchId===t.identifier){dashTouchId=null;dashHeld=false;}
  }
}

function onKey(code){
  ensureAudio();
  if(state==="title"&&(code==="Enter"||code==="Space")) startGame();
  else if(state==="over"&&(code==="Enter"||code==="Space")) startGame();
  else if(state==="levelup"){
    if(code==="Digit1"||code==="Numpad1") pickIdx(0);
    if(code==="Digit2"||code==="Numpad2") pickIdx(1);
    if(code==="Digit3"||code==="Numpad3") pickIdx(2);
  }else if(code==="Escape"||code==="KeyP"){
    if(state==="play"||state==="pause") togglePause();
  }else if(state==="play"){
    if(code==="Space"||code==="ShiftLeft"||code==="ShiftRight") tryDash();
    if(code==="KeyQ") trySkill("shock");
    if(code==="KeyE") trySkill("shield");
    if(code==="KeyR") trySkill("magnet");
  }
}
function onPointer(x,y,isTouch,id){
  mouse.x=x;mouse.y=y;
  if(state==="title"||state==="over"){startGame();return;}
  if(state==="levelup"){pickCardAt(x,y);return;}
  if(state==="pause"){
    if(hitRect(x,y,uiResume)||hitCirc(x,y,uiPause,10)) togglePause();
    return;
  }
  if(state==="play"){
    if(hitCirc(x,y,uiPause,10)){togglePause();return;}
    if(isTouchUI()){
      for(let i=0;i<uiSkills.length;i++){
        if(hitCirc(x,y,uiSkills[i],8)){trySkill(uiSkills[i].id);return;}
      }
      if(hitCirc(x,y,uiDash,12)){
        if(isTouch) dashTouchId=id;
        tryDash();
        return;
      }
    }
    if(isTouch&&x<W*0.5){startJoy(id,x,y);return;}
  }
}
function startJoy(id,x,y){
  const r=Math.max(56,Math.min(W,H)*0.16);
  const ins=getInsets();
  const cx=clamp(x,ins.l+r+8,W*0.5-8);
  const cy=clamp(y,ins.t+r+8,H-ins.b-r-8);
  joy={active:true,id,cx,cy,x:cx,y:cy,dx:0,dy:0,r};
  moveJoy(x,y);
}
function moveJoy(x,y){
  const dx=x-joy.cx,dy=y-joy.cy,l=Math.hypot(dx,dy),max=joy.r,dead=10;
  const k=l>max?max/l:1;
  joy.x=joy.cx+dx*k;joy.y=joy.cy+dy*k;
  if(l<dead){joy.dx=0;joy.dy=0;}
  else{
    const n=norm(dx,dy);
    const mag=clamp((Math.min(l,max)-dead)/(max-dead),0,1);
    joy.dx=n.x*mag;joy.dy=n.y*mag;
  }
}
function endJoy(){joy.active=false;joy.id=null;joy.dx=0;joy.dy=0;}

const UPGRADES=[
  {id:"atk",name:"공격력 강화",desc:"무기 피해가 25% 증가한다",col:"#ff5ea8"},
  {id:"rate",name:"연사 가속",desc:"공격 속도가 18% 빨라진다",col:"#5ee7ff"},
  {id:"spd",name:"가속 부츠",desc:"이동 속도가 14% 증가한다",col:"#7cff6b"},
  {id:"hp",name:"생명 코어",desc:"최대 체력 +25, 즉시 회복",col:"#ff4d6d"},
  {id:"proj",name:"분열 사격",desc:"투사체가 1발 더 나간다",col:"#ffd166"},
  {id:"pierce",name:"관통 코어",desc:"투사체가 적 하나를 더 관통한다",col:"#c77dff"},
  {id:"magnet",name:"자석 필드",desc:"경험치 흡입 범위가 넓어진다",col:"#80ffea"},
  {id:"dashcd",name:"대시 가속",desc:"대시 재사용 대기시간이 줄어든다",col:"#4cc9f0"},
  {id:"dashdmg",name:"돌진 충격",desc:"대시로 베는 피해가 크게 오른다",col:"#f72585"},
  {id:"charge",name:"대시 충전",desc:"대시 충전 횟수가 1 늘어난다",col:"#4895ef"},
  {id:"vamp",name:"흡혈 회로",desc:"적을 처치하면 체력을 조금 회복한다",col:"#ef476f"}
];

let state="title",time=0,kills=0,shake=0,titleT=0,grace=0;
let player,enemies=[],bullets=[],gems=[],particles=[],floats=[],afterimages=[],rings=[],zaps=[];
let cards=[],cardRects=[],spawnAcc=0,eliteAcc=0;
const cam={x:0,y:0};

function reset(){
  player={
    x:0,y:0,r:16,facing:0,
    hp:100,maxHp:100,spd:215,atk:15,rate:0.40,proj:1,pierce:0,
    pickup:95,xp:0,level:1,next:8,
    dashCd:0,dashMaxCd:1.55,dashCharges:1,dashMax:1,
    dashT:0,iframe:0,dashDmg:24,vamp:0,fireCd:0,
    dashVx:0,dashVy:0,dashed:null,
    wep:{laser:1}, wepCd:{}, orbAng:0,
    skillCd:{shock:0,shield:0,magnet:0}, shieldT:0, magnetT:0
  };
  enemies=[];bullets=[];gems=[];particles=[];floats=[];afterimages=[];rings=[];zaps=[];
  time=0;kills=0;shake=0;spawnAcc=0;eliteAcc=0;grace=0.25;
  cam.x=0;cam.y=0;cards=[];cardRects=[];
  endJoy();dashHeld=false;dashTouchId=null;skillHeld=Object.create(null);
}
function startGame(){
  ensureAudio();
  tryFullscreen();
  reset();
  state="play";
  beep(420,0.1,"square",0.07,880);
  burst(0,0,"#5ee7ff",24,220,0.45);
}
function togglePause(){
  if(state==="play"){state="pause";endJoy();beep(320,0.08,"triangle",0.05);}
  else if(state==="pause"){state="play";last=performance.now();beep(520,0.08,"triangle",0.05);}
}

function wrld(x,y){
  const jx=shake?(Math.random()-0.5)*shake*scale:0;
  const jy=shake?(Math.random()-0.5)*shake*scale:0;
  return {x:(x-cam.x)*scale+W/2+jx,y:(y-cam.y)*scale+H/2+jy};
}
function viewSize(){return {w:W/scale,h:H/scale};}

function burst(x,y,col,n,spd,life){
  for(let i=0;i<n;i++){
    const a=rand(0,Math.PI*2),s=rand(spd*0.2,spd);
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life,max:life,col,r:rand(1.4,3.6)});
  }
}
function floatText(x,y,t,col){floats.push({x,y,t,col,life:0.7,vy:-46});}
function ring(x,y,col,max){rings.push({x,y,r:6,max:max||80,col,life:0.32});}

function spawnEnemy(kind){
  const a=rand(0,Math.PI*2);
  const vs=viewSize();
  const dist=Math.max(vs.w,vs.h)*0.58+rand(30,140);
  const x=player.x+Math.cos(a)*dist;
  const y=player.y+Math.sin(a)*dist;
  let e;
  if(kind==="runner") e={x,y,r:11,hp:9,spd:175,dmg:7,xp:1,col:"#ffe066",kind,hit:0};
  else if(kind==="tank") e={x,y,r:22,hp:62,spd:68,dmg:16,xp:3,col:"#c77dff",kind,hit:0};
  else if(kind==="elite") e={x,y,r:28,hp:180,spd:92,dmg:22,xp:10,col:"#ff4d6d",kind,hit:0,elite:true};
  else e={x,y,r:14,hp:18,spd:108,dmg:10,xp:1,col:"#ff5ea8",kind:"grunt",hit:0};
  const ts=1+time/85;
  e.hp=Math.round(e.hp*ts);
  e.max=e.hp;
  e.dmg=Math.round(e.dmg*(1+time/150));
  enemies.push(e);
}


const WEPS={
  laser:{name:"레이저",short:"레이",col:"#5ee7ff",max:5},
  orb:{name:"회전 구체",short:"구체",col:"#c77dff",max:5},
  bolt:{name:"번개",short:"번개",col:"#ffd166",max:5},
  flame:{name:"화염",short:"화염",col:"#ff6b3d",max:5},
  plasma:{name:"플라즈마 광선",short:"플라",col:"#80ffea",fused:true},
  sun:{name:"태양 구체",short:"태양",col:"#ff9f1c",fused:true}
};
const FUSIONS=[
  {id:"fus_plasma",name:"융합: 플라즈마 광선",desc:"레이저와 번개가 하나로 진화한다",col:"#80ffea",need:["laser","bolt"],result:"plasma"},
  {id:"fus_sun",name:"융합: 태양 구체",desc:"회전 구체와 화염이 하나로 진화한다",col:"#ff9f1c",need:["orb","flame"],result:"sun"}
];
function wepLv(id){return (player&&player.wep&&player.wep[id])||0;}
function wepCount(){return player&&player.wep?Object.keys(player.wep).length:0;}
function nearestEnemy(from,ignore){
  from=from||player;
  let best=null,nd=1e12;
  for(let i=0;i<enemies.length;i++){
    const e=enemies[i];
    if(ignore&&ignore.has(e)) continue;
    const d=(e.x-from.x)*(e.x-from.x)+(e.y-from.y)*(e.y-from.y);
    if(d<nd){nd=d;best=e;}
  }
  return best;
}
function hurtEnemy(e,j,dmg,col){
  e.hp-=dmg;e.hit=0.1;
  floatText(e.x,e.y-6,String(Math.round(dmg)),col||"#ffd166");
  burst(e.x,e.y,e.col,4,120,0.18);
  if(e.hp<=0){killEnemy(e,j);return true;}
  return false;
}
function fireLaser(lv,plasma,burstN,aimAng){
  const e=nearestEnemy();
  let base=aimAng;
  if(base==null){
    if(!e) return;
    base=Math.atan2(e.y-player.y,e.x-player.x);
  }
  const n=(burstN||player.proj)+(plasma?1:0);
  const spread=n===1?0:(burstN?0.28:0.2);
  const dmg=player.atk*(0.9+lv*0.22)*(plasma?1.7:1);
  const pierce=player.pierce+(lv>=3?1:0)+(plasma?3:0);
  const spd=plasma?680:540;
  for(let i=0;i<n;i++){
    const a=base+(i-(n-1)/2)*spread;
    bullets.push({
      x:player.x+Math.cos(a)*18,y:player.y+Math.sin(a)*18,
      vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,
      r:plasma?7:5,dmg,life:plasma?1.35:1.2,pierce,hit:new Set(),
      col:plasma?"#80ffea":"#c8ffff",chain:plasma?2:0
    });
  }
}
function fireFlame(lv,sun,burst,aimAng){
  const e=nearestEnemy();
  let base=aimAng!=null?aimAng:player.facing;
  if(e&&aimAng==null) base=Math.atan2(e.y-player.y,e.x-player.x);
  const n=(burst?6:2+Math.floor(lv/2))+(sun?2:0);
  const dmg=player.atk*(0.42+lv*0.14)*(sun?1.45:1);
  const spd=sun?340:280;
  for(let i=0;i<n;i++){
    const a=base+(i-(n-1)/2)*0.22+(rand(-0.05,0.05));
    bullets.push({
      x:player.x+Math.cos(a)*16,y:player.y+Math.sin(a)*16,
      vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,
      r:sun?9:7,dmg,life:burst?0.45:0.32,pierce:sun?1:0,hit:new Set(),
      col:sun?"#ff9f1c":"#ff6b3d",kind:"flame"
    });
  }
}
function fireBolt(lv,plasma,burst){
  if(!enemies.length) return;
  const range=210+lv*28+(plasma?80:0)+(burst?60:0);
  const maxT=burst?5:Math.min(4,2+Math.floor(lv/2));
  const list=enemies.map(e=>({e,d:Math.hypot(e.x-player.x,e.y-player.y)})).filter(o=>o.d<=range);
  list.sort((a,b)=>a.d-b.d);
  const dmg=player.atk*(0.85+lv*0.2)*(plasma?1.4:1)*(burst?1.25:1);
  let prev={x:player.x,y:player.y};
  let hit=0;
  for(let i=0;i<list.length&&hit<maxT;i++){
    const e=list[i].e;
    const j=enemies.indexOf(e);
    if(j<0) continue;
    zaps.push({x1:prev.x,y1:prev.y,x2:e.x,y2:e.y,life:0.14,col:plasma?"#80ffea":"#ffd166"});
    const dead=hurtEnemy(e,j,dmg,plasma?"#80ffea":"#ffd166");
    prev={x:e.x,y:e.y};
    hit++;
    if(dead) continue;
  }
}
function orbTick(dt,burst){
  const sun=wepLv("sun")>0;
  const lv=sun?5:wepLv("orb");
  if(lv<=0) return;
  player.orbAng+=(1.7+lv*0.28)*dt;
  const n=2+Math.floor((lv-1)/2)+(sun?2:0);
  const rad=(52+lv*8)*(burst?1.45:1);
  const dmg=player.atk*(0.5+lv*0.13)*(sun?1.5:1)*(burst?1.3:1);
  const or= (sun?12:8)+(burst?4:0);
  for(let i=0;i<n;i++){
    const a=player.orbAng+i*(Math.PI*2/n);
    const ox=player.x+Math.cos(a)*rad;
    const oy=player.y+Math.sin(a)*rad;
    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j];
      if((e.orbCd||0)>0) continue;
      if(Math.hypot(e.x-ox,e.y-oy)<e.r+or){
        e.orbCd=burst?0.12:0.28;
        hurtEnemy(e,j,dmg,sun?"#ff9f1c":"#c77dff");
      }
    }
  }
}
function updateWeapons(dt){
  if(!player.wepCd) player.wepCd={};
  const cd=player.wepCd;
  const L=wepLv("laser"), P=wepLv("plasma"), O=wepLv("orb"), S=wepLv("sun"), B=wepLv("bolt"), F=wepLv("flame");
  if(L||P){
    const key=P?"plasma":"laser";
    const lv=P?5:L;
    cd[key]=(cd[key]||0)-dt;
    if(cd[key]<=0){
      const e=nearestEnemy();
      if(e){
        cd[key]=Math.max(0.12,(P?0.22:player.rate)*(1-(lv-1)*0.07));
        fireLaser(lv,!!P,0,null);
        beep(760,0.03,"square",0.022);
      }
    }
  }
  if(O||S) orbTick(dt,false);
  if(B||P){
    const key=P?"pbolt":"bolt";
    const lv=P?5:B;
    cd[key]=(cd[key]||0)-dt;
    if(cd[key]<=0 && enemies.length){
      cd[key]=Math.max(0.28,0.72-lv*0.06);
      fireBolt(lv,!!P,false);
      beep(520,0.05,"sawtooth",0.03,180);
    }
  }
  if(F||S){
    const key=S?"sunf":"flame";
    const lv=S?5:F;
    cd[key]=(cd[key]||0)-dt;
    if(cd[key]<=0){
      cd[key]=Math.max(0.12,0.2-lv*0.012);
      fireFlame(lv,!!S,false,null);
    }
  }
  for(let i=zaps.length-1;i>=0;i--){
    zaps[i].life-=dt;
    if(zaps[i].life<=0) zaps.splice(i,1);
  }
}
function buildLevelPool(){
  const pool=[];
  for(const f of FUSIONS){
    if(!wepLv(f.result)&&f.need.every(id=>wepLv(id)>=5)){
      pool.push({id:f.id,name:f.name,desc:f.desc,col:f.col,kind:"fuse",result:f.result,need:f.need});
    }
  }
  for(const id of Object.keys(player.wep||{})){
    const def=WEPS[id];
    if(!def||def.fused) continue;
    const lv=wepLv(id);
    if(lv<5) pool.push({id:"wup_"+id,name:def.name+" 강화",desc:def.name+" 레벨 +1  (Lv."+lv+" → "+(lv+1)+")",col:def.col,kind:"wup",wid:id});
  }
  if(wepCount()<4){
    for(const id of ["laser","orb","bolt","flame"]){
      if(!wepLv(id)){
        const def=WEPS[id];
        pool.push({id:"wnew_"+id,name:"새 무기: "+def.name,desc:def.name+"를 얻는다",col:def.col,kind:"wnew",wid:id});
      }
    }
  }
  for(const u of UPGRADES){
    if(u.id==="charge"&&player.dashMax>=3) continue;
    if(u.id==="proj"&&player.proj>=6) continue;
    pool.push(u);
  }
  return pool;
}

function tryDash(){
  if(state!=="play"||grace>0) return;
  if(dashHeld) return;
  dashHeld=true;
  if(player.dashT>0||player.dashCharges<=0) return;
  let dx=0,dy=0;
  if(keys.KeyW||keys.ArrowUp) dy-=1;
  if(keys.KeyS||keys.ArrowDown) dy+=1;
  if(keys.KeyA||keys.ArrowLeft) dx-=1;
  if(keys.KeyD||keys.ArrowRight) dx+=1;
  if(joy.active&&(joy.dx||joy.dy)){dx=joy.dx;dy=joy.dy;}
  let n;
  if(dx||dy) n=norm(dx,dy);
  else n={x:Math.cos(player.facing),y:Math.sin(player.facing)};
  if(!n.x&&!n.y) n={x:1,y:0};
  player.dashT=0.16;
  player.iframe=0.22;
  player.dashCharges--;
  player.dashVx=n.x*1020;
  player.dashVy=n.y*1020;
  player.facing=Math.atan2(n.y,n.x);
  player.dashed=new Set();
  shake=Math.max(shake,5);
  ring(player.x,player.y,"#5ee7ff",70);
  beep(220,0.13,"sawtooth",0.07,70);
  vibe(15);
}

function trySkill(id){
  if(state!=="play") return;
  if(skillHeld[id]) return;
  skillHeld[id]=true;
  const def=SKILLS.find(s=>s.id===id);
  if(!def||!player) return;
  if((player.skillCd[id]||0)>0) return;
  player.skillCd[id]=def.cd;
  if(id==="shock"){
    const rad=210,dmg=player.atk*2.4;
    ring(player.x,player.y,"#ff5ea8",rad);
    ring(player.x,player.y,"#ffd166",Math.floor(rad*0.55));
    burst(player.x,player.y,"#ff5ea8",28,300,0.4);
    shake=Math.max(shake,10);
    beep(160,0.16,"sawtooth",0.08,50);
    vibe(25);
    for(let i=enemies.length-1;i>=0;i--){
      const e=enemies[i];
      const d=Math.hypot(e.x-player.x,e.y-player.y);
      if(d<rad+e.r){
        const n=norm(e.x-player.x,e.y-player.y);
        const k=1-d/(rad+e.r);
        e.x+=n.x*(80+100*k);e.y+=n.y*(80+100*k);
        hurtEnemy(e,i,dmg,"#ff5ea8");
      }
    }
  }else if(id==="shield"){
    player.shieldT=2.3;
    ring(player.x,player.y,"#5ee7ff",56);
    burst(player.x,player.y,"#5ee7ff",16,180,0.35);
    beep(620,0.12,"triangle",0.07,900);
    vibe(12);
  }else if(id==="magnet"){
    player.magnetT=1.6;
    ring(player.x,player.y,"#7cff6b",100);
    burst(player.x,player.y,"#7cff6b",16,180,0.35);
    beep(880,0.1,"sine",0.06,1400);
    vibe(12);
  }
}

function offerLevelup(){
  state="levelup";
  endJoy();
  const pool=buildLevelPool();
  const fuses=pool.filter(c=>c.kind==="fuse");
  const weps=pool.filter(c=>c.kind==="wup"||c.kind==="wnew");
  const stats=pool.filter(c=>!c.kind);
  cards=[];
  while(cards.length<3&&fuses.length) cards.push(fuses.splice(randi(0,fuses.length-1),1)[0]);
  if(cards.length<3&&weps.length) cards.push(weps.splice(randi(0,weps.length-1),1)[0]);
  const rest=weps.concat(stats);
  while(cards.length<3&&rest.length) cards.push(rest.splice(randi(0,rest.length-1),1)[0]);
  beep(523,0.12,"triangle",0.08,1046);
  vibe(25);
}
function pickIdx(i){
  if(i<0||i>=cards.length) return;
  applyUpgrade(cards[i]);
}
function pickCardAt(x,y){
  for(let i=0;i<cardRects.length;i++){
    const r=cardRects[i];
    if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h){applyUpgrade(cards[i]);return;}
  }
}
function applyUpgrade(u){
  if(u.kind==="wnew") player.wep[u.wid]=1;
  else if(u.kind==="wup") player.wep[u.wid]=Math.min(5,(player.wep[u.wid]||1)+1);
  else if(u.kind==="fuse"){
    for(const id of u.need) delete player.wep[id];
    player.wep[u.result]=5;
  }else switch(u.id){
    case "atk": player.atk*=1.25; break;
    case "rate": player.rate=Math.max(0.12,player.rate*0.82); break;
    case "spd": player.spd*=1.14; break;
    case "hp": player.maxHp+=25; player.hp=Math.min(player.maxHp,player.hp+25); break;
    case "proj": player.proj+=1; break;
    case "pierce": player.pierce+=1; break;
    case "magnet": player.pickup*=1.45; break;
    case "dashcd": player.dashMaxCd=Math.max(0.5,player.dashMaxCd*0.75); break;
    case "dashdmg": player.dashDmg*=1.7; break;
    case "charge": player.dashMax+=1; player.dashCharges+=1; break;
    case "vamp": player.vamp+=3; break;
  }
  burst(player.x,player.y,u.col,20,200,0.4);
  state="play";
  last=performance.now();
  cards=[];cardRects=[];
  beep(880,0.08,"square",0.06);
}

function gainXp(n){
  player.xp+=n;
  while(player.xp>=player.next){
    player.xp-=player.next;
    player.level++;
    player.next=Math.floor(8*Math.pow(1.34,player.level-1));
    offerLevelup();
  }
}

function hurtPlayer(dmg,ex,ey){
  if(player.iframe>0) return;
  if(player.shieldT>0){
    burst(player.x,player.y,"#5ee7ff",10,160,0.25);
    beep(880,0.06,"triangle",0.05);
    return;
  }
  player.hp-=dmg;
  player.iframe=0.45;
  shake=Math.max(shake,8);
  const n=norm(player.x-ex,player.y-ey);
  player.x+=n.x*28;player.y+=n.y*28;
  burst(player.x,player.y,"#ff4d6d",14,200,0.35);
  beep(140,0.15,"sawtooth",0.08,60);
  vibe(40);
  if(player.hp<=0){
    player.hp=0;
    state="over";
    endJoy();
    burst(player.x,player.y,"#5ee7ff",40,320,0.7);
    ring(player.x,player.y,"#ff4d6d",160);
    beep(200,0.4,"sawtooth",0.1,40);
    vibe([80,40,140]);
  }
}

function killEnemy(e,i){
  enemies.splice(i,1);
  kills++;
  burst(e.x,e.y,e.col,e.elite?28:12,e.elite?280:180,0.4);
  ring(e.x,e.y,e.col,e.elite?120:50);
  gems.push({x:e.x,y:e.y,v:e.xp,vy:-40,life:0.12});
  if(e.xp>=3) gems.push({x:e.x+rand(-8,8),y:e.y+rand(-8,8),v:Math.max(1,e.xp-2),vy:-20,life:0.08});
  if(player.vamp>0){
    const heal=player.vamp;
    player.hp=Math.min(player.maxHp,player.hp+heal);
    floatText(player.x,player.y-20,"+"+heal,"#7cff6b");
  }
  beep(e.elite?180:320,0.07,"triangle",0.04,90);
}

function update(dt){
  titleT+=dt;
  if(state==="title"||state==="over"){
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
      if(p.life<=0) particles.splice(i,1);
    }
    return;
  }
  if(state==="levelup"||state==="pause") return;

  time+=dt;
  grace=Math.max(0,grace-dt);
  shake=Math.max(0,shake-dt*28);
  if(player.skillCd){
    for(const k of Object.keys(player.skillCd)) player.skillCd[k]=Math.max(0,player.skillCd[k]-dt);
  }
  player.shieldT=Math.max(0,(player.shieldT||0)-dt);
  player.magnetT=Math.max(0,(player.magnetT||0)-dt);

  let mx=0,my=0;
  if(keys.KeyW||keys.ArrowUp) my-=1;
  if(keys.KeyS||keys.ArrowDown) my+=1;
  if(keys.KeyA||keys.ArrowLeft) mx-=1;
  if(keys.KeyD||keys.ArrowRight) mx+=1;
  if(joy.active){mx+=joy.dx;my+=joy.dy;}
  if(player.dashT>0){
    player.dashT-=dt;
    player.x+=player.dashVx*dt;
    player.y+=player.dashVy*dt;
    afterimages.push({x:player.x,y:player.y,life:0.22,ang:player.facing});
    for(let i=enemies.length-1;i>=0;i--){
      const e=enemies[i];
      if(player.dashed.has(e)) continue;
      if(Math.hypot(e.x-player.x,e.y-player.y)<e.r+player.r+8){
        player.dashed.add(e);
        const dmg=player.dashDmg;
        e.hp-=dmg;e.hit=0.12;
        floatText(e.x,e.y-8,String(Math.round(dmg)),"#5ee7ff");
        burst(e.x,e.y,"#5ee7ff",8,200,0.25);
        const n=norm(e.x-player.x,e.y-player.y);
        e.x+=n.x*36;e.y+=n.y*36;
        if(e.hp<=0) killEnemy(e,i);
      }
    }
  }else{
    const raw=Math.hypot(mx,my);
    if(raw>0.001){
      const n=norm(mx,my);
      const mag=clamp(raw,0,1);
      player.x+=n.x*player.spd*mag*dt;
      player.y+=n.y*player.spd*mag*dt;
      player.facing=Math.atan2(n.y,n.x);
    }
  }

  player.iframe=Math.max(0,player.iframe-dt);
  if(player.dashCharges<player.dashMax){
    player.dashCd+=dt;
    if(player.dashCd>=player.dashMaxCd){
      player.dashCd=0;
      player.dashCharges++;
    }
  }else player.dashCd=0;

  cam.x+=(player.x-cam.x)*Math.min(1,dt*8);
  cam.y+=(player.y-cam.y)*Math.min(1,dt*8);

  updateWeapons(dt);

  const rate=1.1+Math.min(3.2,time/28);
  spawnAcc+=dt*rate;
  while(spawnAcc>=1 && enemies.length<75){
    spawnAcc-=1;
    let kind="grunt";
    const r=Math.random();
    if(time>25&&r<0.22) kind="runner";
    else if(time>40&&r<0.38) kind="tank";
    spawnEnemy(kind);
  }
  eliteAcc+=dt;
  if(eliteAcc>22+Math.max(0,20-time/10) && enemies.length<75){
    eliteAcc=0;
    spawnEnemy("elite");
  }

  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    e.hit=Math.max(0,e.hit-dt);
    e.orbCd=Math.max(0,(e.orbCd||0)-dt);
    const n=norm(player.x-e.x,player.y-e.y);
    e.x+=n.x*e.spd*dt;
    e.y+=n.y*e.spd*dt;
    if(Math.hypot(e.x-player.x,e.y-player.y)<e.r+player.r-2){
      hurtPlayer(e.dmg,e.x,e.y);
    }
  }

  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.life<=0){bullets.splice(i,1);continue;}
    let dead=false;
    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j];
      if(b.hit.has(e)) continue;
      if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+b.r){
        b.hit.add(e);
        e.hp-=b.dmg;e.hit=0.1;
        floatText(e.x,e.y-6,String(Math.round(b.dmg)),b.col||"#ffd166");
        burst(b.x,b.y,b.col||e.col,5,140,0.22);
        if(e.hp<=0) killEnemy(e,j);
        if(b.chain&&b.chain>0){
          const nxt=nearestEnemy(b,b.hit);
          if(nxt){
            const a=Math.atan2(nxt.y-b.y,nxt.x-b.x);
            b.vx=Math.cos(a)*640;b.vy=Math.sin(a)*640;
            b.chain--;
          }else dead=true;
        }
        if(b.hit.size>b.pierce){dead=true;break;}
      }
    }
    if(dead) bullets.splice(i,1);
  }

  for(let i=gems.length-1;i>=0;i--){
    const g=gems[i];
    if(g.life>0){g.life-=dt;g.y+=g.vy*dt;g.vy+=180*dt;}
    const dx=player.x-g.x,dy=player.y-g.y,d=Math.hypot(dx,dy);
    if(player.magnetT>0||d<player.pickup+40){
      const pull=norm(dx,dy);
      const s=player.magnetT>0?980:(d<player.pickup?520:220);
      g.x+=pull.x*s*dt;g.y+=pull.y*s*dt;
    }
    if(d<18){
      gainXp(g.v);
      gems.splice(i,1);
      beep(980,0.04,"sine",0.03,1400);
    }
  }

  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.98;p.vy*=0.98;p.life-=dt;
    if(p.life<=0) particles.splice(i,1);
  }
  for(let i=floats.length-1;i>=0;i--){
    const f=floats[i];
    f.y+=f.vy*dt;f.life-=dt;
    if(f.life<=0) floats.splice(i,1);
  }
  for(let i=afterimages.length-1;i>=0;i--){
    afterimages[i].life-=dt;
    if(afterimages[i].life<=0) afterimages.splice(i,1);
  }
  for(let i=rings.length-1;i>=0;i--){
    const r=rings[i];
    r.life-=dt;r.r+=(r.max-r.r)*dt*8;
    if(r.life<=0) rings.splice(i,1);
  }
}

function drawGrid(){
  const step=64*scale;
  const ox=(((cam.x*scale)%step)+step)%step;
  const oy=(((cam.y*scale)%step)+step)%step;
  ctx.strokeStyle="rgba(80,120,180,0.07)";
  ctx.lineWidth=1;
  ctx.beginPath();
  for(let x=-ox;x<W+step;x+=step){ctx.moveTo(x,0);ctx.lineTo(x,H);}
  for(let y=-oy;y<H+step;y+=step){ctx.moveTo(0,y);ctx.lineTo(W,y);}
  ctx.stroke();
}

function drawBody(x,y,ang,alpha,glow){
  ctx.save();
  ctx.translate(x,y);ctx.rotate(ang);ctx.globalAlpha=alpha;
  const s=Math.max(0.85,scale);
  ctx.scale(s,s);
  ctx.shadowColor="#5ee7ff";ctx.shadowBlur=glow;
  ctx.fillStyle="#d8ffff";
  ctx.beginPath();
  ctx.moveTo(16,0);ctx.lineTo(0,11);ctx.lineTo(-12,0);ctx.lineTo(0,-11);
  ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle="#4adfff";
  ctx.beginPath();
  ctx.moveTo(9,0);ctx.lineTo(0,6);ctx.lineTo(-6,0);ctx.lineTo(0,-6);
  ctx.closePath();ctx.fill();
  ctx.fillStyle="#fff";
  ctx.beginPath();ctx.arc(4,0,2.6,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function rounded(x,y,w,h,r){
  const rr=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+rr,y);
  ctx.arcTo(x+w,y,x+w,y+h,rr);
  ctx.arcTo(x+w,y+h,x,y+h,rr);
  ctx.arcTo(x,y+h,x,y,rr);
  ctx.arcTo(x,y,x+w,y,rr);
  ctx.closePath();
}

function draw(){
  ctx.fillStyle="#05060d";
  ctx.fillRect(0,0,W,H);
  drawGrid();

  if(state==="title"){
    drawTitle();
    return;
  }

  for(const r of rings){
    const s=wrld(r.x,r.y);
    ctx.strokeStyle=r.col;
    ctx.globalAlpha=Math.max(0,r.life/0.32)*0.7;
    ctx.lineWidth=3*scale;
    ctx.beginPath();ctx.arc(s.x,s.y,r.r*scale,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=1;
  }
  for(const p of particles){
    const s=wrld(p.x,p.y);
    ctx.globalAlpha=Math.max(0,p.life/p.max);
    ctx.fillStyle=p.col;
    ctx.shadowColor=p.col;ctx.shadowBlur=8;
    ctx.beginPath();ctx.arc(s.x,s.y,p.r*scale,0,Math.PI*2);ctx.fill();
  }
  ctx.shadowBlur=0;ctx.globalAlpha=1;

  for(const g of gems){
    const s=wrld(g.x,g.y);
    ctx.fillStyle="#7cff6b";
    ctx.shadowColor="#7cff6b";ctx.shadowBlur=10;
    const k=5*scale;
    ctx.beginPath();
    ctx.moveTo(s.x,s.y-k-1);ctx.lineTo(s.x+k,s.y);ctx.lineTo(s.x,s.y+k+1);ctx.lineTo(s.x-k,s.y);
    ctx.closePath();ctx.fill();
  }
  ctx.shadowBlur=0;

  for(const e of enemies){
    const s=wrld(e.x,e.y);
    ctx.save();
    ctx.translate(s.x,s.y);
    ctx.shadowColor=e.col;ctx.shadowBlur=e.elite?22:12;
    ctx.fillStyle=e.hit>0?"#fff":e.col;
    ctx.beginPath();ctx.arc(0,0,e.r*scale,0,Math.PI*2);ctx.fill();
    if(e.elite){
      ctx.strokeStyle="#ffd166";ctx.lineWidth=2;ctx.shadowColor="#ffd166";
      ctx.beginPath();ctx.arc(0,0,(e.r+5)*scale,0,Math.PI*2);ctx.stroke();
    }
    ctx.shadowBlur=0;
    const ratio=Math.max(0,e.hp/e.max);
    if(ratio<1){
      const rw=e.r*2*scale,rh=3;
      ctx.fillStyle="rgba(0,0,0,0.5)";
      ctx.fillRect(-rw/2,e.r*scale+4,rw,rh);
      ctx.fillStyle="#ff4d6d";
      ctx.fillRect(-rw/2,e.r*scale+4,rw*ratio,rh);
    }
    ctx.restore();
  }

  for(const b of bullets){
    const s=wrld(b.x,b.y);
    ctx.fillStyle=b.col||"#c8ffff";
    ctx.shadowColor=b.col||"#5ee7ff";ctx.shadowBlur=14;
    ctx.beginPath();ctx.arc(s.x,s.y,b.r*scale,0,Math.PI*2);ctx.fill();
  }
  ctx.shadowBlur=0;
  for(const z of zaps){
    const a=wrld(z.x1,z.y1),b=wrld(z.x2,z.y2);
    ctx.strokeStyle=z.col;ctx.globalAlpha=Math.max(0,z.life/0.14);
    ctx.shadowColor=z.col;ctx.shadowBlur=12;ctx.lineWidth=2.5*scale;
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    ctx.globalAlpha=1;ctx.shadowBlur=0;
  }
  if(player&&(wepLv("orb")||wepLv("sun"))){
    const sun=wepLv("sun")>0,lv=sun?5:wepLv("orb");
    const n=2+Math.floor((lv-1)/2)+(sun?2:0),rad=52+lv*8,or=sun?12:8;
    for(let i=0;i<n;i++){
      const a=player.orbAng+i*(Math.PI*2/n);
      const s=wrld(player.x+Math.cos(a)*rad,player.y+Math.sin(a)*rad);
      ctx.fillStyle=sun?"#ff9f1c":"#c77dff";
      ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=14;
      ctx.beginPath();ctx.arc(s.x,s.y,or*scale,0,Math.PI*2);ctx.fill();
    }
    ctx.shadowBlur=0;
  }

  for(const a of afterimages){
    const s=wrld(a.x,a.y);
    drawBody(s.x,s.y,a.ang,a.life*1.6,8);
  }

  if(state!=="over"||player.hp>0){
    const s=wrld(player.x,player.y);
    const flicker=player.iframe>0&&Math.floor(titleT*24)%2===0;
    if(!flicker||player.dashT>0) drawBody(s.x,s.y,player.facing,1,player.dashT>0?32:18);
    if(player.shieldT>0){
      const pulse=0.65+0.35*Math.sin(titleT*8);
      ctx.strokeStyle="#5ee7ff";
      ctx.globalAlpha=0.55*pulse;
      ctx.shadowColor="#5ee7ff";ctx.shadowBlur=18;
      ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(s.x,s.y,(player.r+12)*scale,0,Math.PI*2);ctx.stroke();
      ctx.globalAlpha=1;ctx.shadowBlur=0;
    }
  }

  for(const f of floats){
    const s=wrld(f.x,f.y);
    ctx.globalAlpha=Math.max(0,f.life/0.7);
    ctx.fillStyle=f.col;
    ctx.font="bold 14px "+FONT;
    ctx.textAlign="center";
    ctx.fillText(f.t,s.x,s.y);
  }
  ctx.globalAlpha=1;

  const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.72);
  vg.addColorStop(0,"rgba(0,0,0,0)");
  vg.addColorStop(1,"rgba(0,0,0,0.55)");
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);

  if(state==="play"||state==="pause"){
    drawHud();
    drawTouchControls();
  }
  if(state==="levelup") drawLevelup();
  if(state==="pause") drawPause();
  if(state==="over") drawOver();
}

function mmss(t){
  const m=Math.floor(t/60),s=Math.floor(t%60);
  return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
}

function drawHud(){
  const ins=getInsets();
  const u=clamp(Math.min(W,H)/390,0.85,1.35);
  const pad=Math.max(10,10*u);
  const top=ins.t+pad;
  const barH=Math.max(14,16*u);
  const barW=Math.max(120,uiPause.x-uiPause.r-pad-ins.l-pad);
  const bx=ins.l+pad,by=top;

  ctx.fillStyle="rgba(8,10,20,0.7)";
  rounded(bx,by,barW,barH,8);ctx.fill();
  const hp=player.maxHp?player.hp/player.maxHp:0;
  ctx.save();
  rounded(bx,by,barW,barH,8);ctx.clip();
  ctx.fillStyle=hp>0.35?"#5ee7ff":"#ff4d6d";
  ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=8;
  ctx.fillRect(bx,by,barW*clamp(hp,0,1),barH);
  ctx.restore();
  ctx.strokeStyle="rgba(180,230,255,0.35)";ctx.lineWidth=1;
  rounded(bx,by,barW,barH,8);ctx.stroke();
  ctx.fillStyle="#dff";ctx.font="bold "+Math.max(11,12*u)+"px "+FONT;ctx.textAlign="left";
  ctx.shadowBlur=0;
  ctx.fillText("HP  "+Math.ceil(player.hp)+" / "+player.maxHp,bx+8,by+barH-4);

  ctx.font="bold "+Math.max(22,26*u)+"px "+FONT;
  ctx.textAlign="center";
  ctx.fillStyle="#e8fbff";
  ctx.shadowColor="#5ee7ff";ctx.shadowBlur=12;
  ctx.fillText(mmss(time),W/2,by+barH+Math.max(22,24*u));
  ctx.shadowBlur=0;

  ctx.font="bold "+Math.max(12,13*u)+"px "+FONT;
  ctx.fillStyle="#cfe";
  ctx.textAlign="left";
  ctx.fillText("Lv."+player.level+"   처치 "+kills,bx,by+barH+Math.max(16,18*u));

  const p=uiPause;
  ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
  ctx.fillStyle="rgba(12,16,28,0.82)";ctx.fill();
  ctx.strokeStyle="rgba(180,230,255,0.55)";ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle="#e8fbff";
  const bw=Math.max(4,5*u),bh=Math.max(12,14*u),gap=Math.max(3,4*u);
  ctx.fillRect(p.x-gap-bw/2,p.y-bh/2,bw,bh);
  ctx.fillRect(p.x+gap-bw/2,p.y-bh/2,bw,bh);

  const xpW=Math.min(barW, W-ins.l-ins.r-pad*2-(isTouchUI()?uiPause.r*2+pad*2:0));
  const xpH=Math.max(7,8*u);
  const xx=bx,xy=by+barH+Math.max(34,36*u);
  ctx.fillStyle="rgba(8,10,20,0.7)";
  rounded(xx,xy,xpW,xpH,4);ctx.fill();
  ctx.fillStyle="#7cff6b";
  ctx.save();rounded(xx,xy,xpW,xpH,4);ctx.clip();
  ctx.fillRect(xx,xy,xpW*clamp(player.xp/player.next,0,1),xpH);
  ctx.restore();

  if(player&&player.wep){
    let wx=xx, wy=xy+xpH+6;
    const ih=Math.max(16,18*u), iw=Math.max(46,50*u);
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.font="bold "+Math.max(9,10*u)+"px "+FONT;
    for(const id of Object.keys(player.wep)){
      const def=WEPS[id]; if(!def) continue;
      if(wx+iw>xx+xpW+8){ wx=xx; wy+=ih+4; }
      ctx.fillStyle="rgba(8,10,20,0.75)";
      rounded(wx,wy,iw,ih,6);ctx.fill();
      ctx.strokeStyle=def.col;ctx.lineWidth=1.2;rounded(wx,wy,iw,ih,6);ctx.stroke();
      ctx.fillStyle=def.col;
      const lab=def.fused?def.short:def.short+" "+player.wep[id];
      ctx.fillText(lab,wx+iw/2,wy+ih/2);
      wx+=iw+4;
    }
    ctx.textBaseline="alphabetic";
  }

  if(!isTouchUI()){
    const dsz=14,dsy=by+barH+Math.max(24,28*u);
    for(let i=0;i<player.dashMax;i++){
      const filled=i<player.dashCharges;
      ctx.fillStyle=filled?"#5ee7ff":"rgba(90,130,160,0.35)";
      ctx.shadowColor="#5ee7ff";ctx.shadowBlur=filled?10:0;
      ctx.beginPath();
      const dx=bx+8+i*20;
      ctx.moveTo(dx,dsy);ctx.lineTo(dx+7,dsy+dsz/2);ctx.lineTo(dx,dsy+dsz);ctx.lineTo(dx-7,dsy+dsz/2);
      ctx.closePath();ctx.fill();
    }
    ctx.shadowBlur=0;
    if(player.dashCharges<player.dashMax){
      ctx.fillStyle="rgba(94,231,255,0.8)";
      const ratio=player.dashCd/player.dashMaxCd;
      ctx.fillRect(bx,dsy+dsz+4,60*ratio,3);
    }
    ctx.fillStyle="rgba(200,230,255,0.7)";
    ctx.font="11px "+FONT;ctx.textAlign="left";
    ctx.fillText("SPACE 대시  ·  Q 충격파  ·  E 보호막  ·  R 자석",bx+player.dashMax*20+10,dsy+12);
  }
}

function drawTouchControls(){
  if(!isTouchUI()) return;
  const ins=getInsets();
  if(!joy.active){
    const r=Math.max(52,Math.min(W,H)*0.13);
    const hx=ins.l+r+22,hy=H-ins.b-r-18;
    ctx.globalAlpha=0.28;
    ctx.strokeStyle="#5ee7ff";ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(hx,hy,r,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(hx,hy,r*0.38,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=0.4;
    ctx.font="bold 12px "+FONT;ctx.textAlign="center";ctx.fillStyle="#9befff";
    ctx.fillText("이동",hx,hy+r+16);
    ctx.globalAlpha=1;
  }else{
    ctx.strokeStyle="rgba(94,231,255,0.55)";ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(joy.cx,joy.cy,joy.r,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle="rgba(10,18,28,0.35)";
    ctx.beginPath();ctx.arc(joy.cx,joy.cy,joy.r,0,Math.PI*2);ctx.fill();
    ctx.shadowColor="#5ee7ff";ctx.shadowBlur=16;
    ctx.fillStyle="#5ee7ff";
    ctx.beginPath();ctx.arc(joy.x,joy.y,joy.r*0.38,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  }

  const d=uiDash;
  const ready=player.dashCharges>0&&player.dashT<=0;
  ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);
  ctx.fillStyle=ready?"rgba(8,40,55,0.88)":"rgba(8,14,24,0.75)";
  ctx.fill();
  ctx.shadowColor="#5ee7ff";ctx.shadowBlur=ready?18:6;
  ctx.strokeStyle=ready?"#5ee7ff":"rgba(94,231,255,0.4)";
  ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.stroke();
  if(player.dashCharges<player.dashMax){
    const ratio=clamp(player.dashCd/player.dashMaxCd,0,1);
    ctx.strokeStyle="#ffd166";ctx.lineWidth=4;ctx.shadowColor="#ffd166";
    ctx.beginPath();
    ctx.arc(d.x,d.y,d.r-3,-Math.PI/2,-Math.PI/2+Math.PI*2*ratio,false);
    ctx.stroke();
  }
  ctx.shadowBlur=0;
  ctx.fillStyle=ready?"#e8fbff":"rgba(200,230,255,0.65)";
  ctx.font="bold "+Math.max(16,d.r*0.34)+"px "+FONT;
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("대시",d.x,d.y-6);
  ctx.font="bold "+Math.max(11,d.r*0.24)+"px "+FONT;
  ctx.fillStyle="#5ee7ff";
  ctx.fillText(player.dashCharges+" / "+player.dashMax,d.x,d.y+d.r*0.32);
  ctx.textBaseline="alphabetic";

  for(const s of uiSkills){
    const remain=player&&player.skillCd?player.skillCd[s.id]||0:0;
    const ready=remain<=0;
    const def=SKILLS.find(k=>k.id===s.id);
    const maxCd=def?def.cd:1;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=ready?"rgba(8,18,32,0.88)":"rgba(8,12,20,0.75)";
    ctx.fill();
    ctx.shadowColor=s.col;ctx.shadowBlur=ready?14:4;
    ctx.strokeStyle=ready?s.col:"rgba(160,200,230,0.35)";
    ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.stroke();
    if(!ready){
      const ratio=1-remain/maxCd;
      ctx.strokeStyle=s.col;ctx.lineWidth=3.5;ctx.shadowColor=s.col;ctx.shadowBlur=8;
      ctx.beginPath();
      ctx.arc(s.x,s.y,s.r-3,-Math.PI/2,-Math.PI/2+Math.PI*2*ratio,false);
      ctx.stroke();
    }
    ctx.shadowBlur=0;
    drawSkillIcon(s.id,s.x,s.y-5,s.r,ready?s.col:"rgba(180,210,230,0.45)");
    ctx.fillStyle=ready?"#e8fbff":"rgba(200,230,255,0.55)";
    ctx.font="bold "+Math.max(9,s.r*0.32)+"px "+FONT;
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(s.short,s.x,s.y+s.r*0.42);
    ctx.font="bold "+Math.max(8,s.r*0.26)+"px "+FONT;
    ctx.fillStyle=ready?s.col:"rgba(160,200,230,0.5)";
    ctx.fillText(s.key,s.x,s.y-s.r*0.58);
    ctx.textBaseline="alphabetic";
  }
}
function drawSkillIcon(id,x,y,r,col){
  ctx.save();
  ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=Math.max(1.5,r*0.08);
  ctx.shadowColor=col;ctx.shadowBlur=6;
  if(id==="shock"){
    ctx.beginPath();ctx.arc(x,y,r*0.16,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(x,y,r*0.32,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(x,y,r*0.48,0,Math.PI*2);ctx.stroke();
  }else if(id==="shield"){
    ctx.beginPath();
    ctx.moveTo(x,y-r*0.48);
    ctx.lineTo(x+r*0.38,y-r*0.22);
    ctx.lineTo(x+r*0.32,y+r*0.16);
    ctx.lineTo(x,y+r*0.46);
    ctx.lineTo(x-r*0.32,y+r*0.16);
    ctx.lineTo(x-r*0.38,y-r*0.22);
    ctx.closePath();ctx.stroke();
  }else if(id==="magnet"){
    const k=r*0.32;
    ctx.beginPath();
    ctx.moveTo(x,y-k);ctx.lineTo(x+k,y);ctx.lineTo(x,y+k);ctx.lineTo(x-k,y);
    ctx.closePath();ctx.fill();
  }
  ctx.restore();
}

function drawLevelup(){
  const ins=getInsets();
  const u=clamp(Math.min(W,H)/390,0.85,1.35);

  ctx.shadowBlur=0;
  ctx.font=Math.max(13,14*u)+"px "+FONT;
  ctx.fillStyle="rgba(200,230,255,0.7)";
  ctx.fillText("강화 하나를 고르세요",W/2,ins.t+Math.max(58,64*u));

  cardRects=[];
  if(portrait){
    const cw=W-ins.l-ins.r-20;
    const gap=10;
    const top=ins.t+Math.max(74,80*u);

    const ch=Math.min(168,(bot-top-gap*2)/3);
    const sx=ins.l+10;
    let y=top;
    for(let i=0;i<cards.length;i++){
      drawCard(cards[i],i,sx,y,cw,ch,u,true);
      y+=ch+gap;

  }else{
    const gap=14;
    const cw=Math.min(260,(W-ins.l-ins.r-40-gap*2)/3);
    const ch=Math.min(230,H-ins.t-ins.b-120);
    const total=cards.length*cw+(cards.length-1)*gap;
    const sx=W/2-total/2,sy=ins.t+Math.max(80,H*0.22);
    for(let i=0;i<cards.length;i++){
      drawCard(cards[i],i,sx+i*(cw+gap),sy,cw,ch,u,false);

}
function drawCard(u,i,x,y,cw,ch,sc,wide){
  cardRects.push({x,y,w:cw,h:ch});
  const hover=mouse.x>=x&&mouse.x<=x+cw&&mouse.y>=y&&mouse.y<=y+ch;
  ctx.shadowColor=u.col;ctx.shadowBlur=hover?24:10;
  ctx.fillStyle=hover?"#151a2a":"#0c101c";
  rounded(x,y,cw,ch,16);ctx.fill();
  ctx.strokeStyle=u.col;ctx.lineWidth=hover?3:2;
  rounded(x,y,cw,ch,16);ctx.stroke();
  ctx.shadowBlur=0;
  ctx.textAlign=wide?"left":"center";
  const tx=wide?x+22:x+cw/2;
  ctx.fillStyle=u.col;
  ctx.font="bold "+Math.max(13,14*sc)+"px "+FONT;
  ctx.fillText((i+1)+"",wide?x+cw-20:x+cw/2,y+(wide?ch/2+6:28));
  ctx.fillStyle="#f3feff";
  ctx.font="bold "+Math.max(18,20*sc)+"px "+FONT;
  if(wide){
    ctx.textAlign="left";
    ctx.fillText(u.name,tx,y+ch*0.38);
    ctx.fillStyle="rgba(200,220,240,0.9)";
    ctx.font=Math.max(14,15*sc)+"px "+FONT;
    wrapText(u.desc,tx,y+ch*0.62,cw-50,Math.max(18,20*sc));
  }else{
    ctx.textAlign="center";
    wrapText(u.name,x+cw/2,y+64,cw-28,24);
    ctx.fillStyle="rgba(200,220,240,0.85)";
    ctx.font=Math.max(14,15*sc)+"px "+FONT;
    wrapText(u.desc,x+cw/2,y+118,cw-28,22);
  }
}
function wrapText(t,x,y,max,lh){
  let line="",yy=y;
  for(const ch of t){
    const test=line+ch;
    if(ctx.measureText(test).width>max&&line){
      ctx.fillText(line,x,yy);line=ch;yy+=lh;
    }else line=test;
  }
  if(line) ctx.fillText(line,x,yy);
}

function drawPause(){
  ctx.fillStyle="rgba(4,6,14,0.62)";
  ctx.fillRect(0,0,W,H);
  const u=clamp(Math.min(W,H)/390,0.85,1.35);
  ctx.textAlign="center";
  ctx.font="bold "+Math.max(32,36*u)+"px "+FONT;
  ctx.fillStyle="#e8fbff";
  ctx.shadowColor="#5ee7ff";ctx.shadowBlur=14;
  ctx.fillText("일시정지",W/2,H*0.42);
  ctx.shadowBlur=0;
  const r=uiResume;
  ctx.shadowColor="#5ee7ff";ctx.shadowBlur=16;
  ctx.fillStyle="#5ee7ff";
  rounded(r.x,r.y,r.w,r.h,14);ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle="#051018";
  ctx.font="bold "+Math.max(18,20*u)+"px "+FONT;
  ctx.fillText("계속하기",r.x+r.w/2,r.y+r.h*0.64);
}

function drawOver(){
  const ins=getInsets();
  const u=clamp(Math.min(W,H)/390,0.85,1.35);
  ctx.fillStyle="rgba(4,6,14,0.62)";
  ctx.fillRect(0,0,W,H);
  ctx.textAlign="center";
  ctx.font="bold "+Math.max(36,44*u)+"px "+FONT;
  ctx.fillStyle="#ff6b8a";
  ctx.shadowColor="#ff4d6d";ctx.shadowBlur=20;
  ctx.fillText("전투 종료",W/2,H*0.34);
  ctx.shadowBlur=0;
  ctx.fillStyle="#e8fbff";
  ctx.font=Math.max(16,18*u)+"px "+FONT;
  ctx.fillText("생존  "+mmss(time)+"    레벨  "+player.level+"    처치  "+kills,W/2,H*0.34+48);
  const bw=Math.min(300,W*0.72),bh=Math.max(54,56*u);
  const bx=W/2-bw/2,by=H*0.34+90;
  ctx.fillStyle="#5ee7ff";
  ctx.shadowColor="#5ee7ff";ctx.shadowBlur=16;
  rounded(bx,by,bw,bh,14);ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle="#051018";
  ctx.font="bold "+Math.max(18,20*u)+"px "+FONT;
  ctx.fillText("탭하여 다시 시작",W/2,by+bh*0.64);
  ctx.font=Math.max(12,13*u)+"px "+FONT;
  ctx.fillStyle="rgba(200,230,255,0.7)";
  ctx.fillText("키보드: Enter",W/2,by+bh+24);
}

let last=performance.now();
function loop(now){
  let dt=Math.min(0.033,(now-last)/1000);
  last=now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
